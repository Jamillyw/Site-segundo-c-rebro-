    /* ============================================================
       UTILITÁRIOS
       ============================================================ */

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function todayStr(date = new Date()) {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");
    }

    function dateFromStr(str) {
      if (!str) return new Date();

      const [y, m, d] = str.split("-").map(Number);

      return new Date(
        y,
        m - 1,
        d
      );
    }

    function addDaysStr(str, amount) {
      const d = dateFromStr(str);
      d.setDate(d.getDate() + amount);
      return todayStr(d);
    }

    function formatDate(str) {
      const d = dateFromStr(str);

      return d.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatShortDate(str) {
      const d = dateFromStr(str);

      return d.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "short"
      });
    }

    function monthKey(str) {
      return String(str || "").slice(0, 7);
    }

    function currentMonthKey() {
      return monthKey(todayStr());
    }

    function previousMonthKey() {
      const d = new Date();

      d.setMonth(d.getMonth() - 1);

      return [
        d.getFullYear(),
        pad(d.getMonth() + 1)
      ].join("-");
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL"
      }).format(Number(value) || 0);
    }

    function uid(prefix = "id") {
      return (
        prefix +
        "_" +
        Math.random().toString(36).slice(2, 9) +
        Date.now().toString(36)
      );
    }

    function clamp(value, min, max) {
      return Math.min(
        max,
        Math.max(min, value)
      );
    }

    function normalizeArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function isoDayOfWeek(str) {
      return dateFromStr(str).getDay();
    }

    function formatTime(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;

      return `${pad(h)}:${pad(m)}`;
    }

    function parseTime(value) {
      if (!value) return null;

      const parts = value.split(":");

      if (parts.length !== 2) {
        return null;
      }

      const h = Number(parts[0]);
      const m = Number(parts[1]);

      if (
        !Number.isFinite(h) ||
        !Number.isFinite(m) ||
        h < 0 ||
        h > 23 ||
        m < 0 ||
        m > 59
      ) {
        return null;
      }

      return h * 60 + m;
    }

    function daysBetween(a, b) {
      const da = dateFromStr(a);
      const db = dateFromStr(b);

      const diff = db.getTime() - da.getTime();

      return Math.round(diff / 86400000);
    }

    function xpForLevel(level) {
      return Math.round(
        100 + (level - 1) * 75
      );
    }

    function calculateLevel(totalXP) {
      let level = 1;
      let xp = Math.max(0, Number(totalXP) || 0);

      while (xp >= xpForLevel(level)) {
        xp -= xpForLevel(level);
        level += 1;
      }

      return {
        level,
        currentXP: xp,
        requiredXP: xpForLevel(level)
      };
    }

    /* ============================================================

    function normalizeData(raw) {
      const base = defaultData();

      if (!raw || typeof raw !== "object") {
        return base;
      }

      const merged = {
        ...base,
        ...raw,

        user: {
          ...base.user,
          ...(raw.user || {})
        },

        settings: {
          ...base.settings,
          ...(raw.settings || {})
        },

        focusGoal: {
          ...base.focusGoal,
          ...(raw.focusGoal || {})
        }
      };

      const arrays = [
        "xpHistory",
        "completionDates",
        "routineEvents",
        "quests",
        "calendarEvents",
        "workouts",
        "workoutHistory",
        "transactions",
        "reflections",
        "achievements"
      ];

      arrays.forEach(key => {
        merged[key] = normalizeArray(merged[key]);
      });

      merged.financeCategories =
        Array.isArray(merged.financeCategories)
          ? merged.financeCategories
          : [...FINANCE_CATEGORIES];

      merged.budgets =
        merged.budgets &&
        typeof merged.budgets === "object"
          ? merged.budgets
          : {};

      return merged;
    }


    /* ============================================================
       STORAGE
       ============================================================ */

    async function loadStorage() {
      try {
        if (
          window.storage &&
          typeof window.storage.get === "function"
        ) {
          const result =
            await window.storage.get(STORAGE_KEY);

          if (result) {
            const parsed =
              typeof result === "string"
                ? JSON.parse(result)
                : result;

            return normalizeData(parsed);
          }
        }
      } catch (error) {
        console.warn(
          "window.storage indisponível:",
          error
        );
      }

      try {
        const raw =
          localStorage.getItem(STORAGE_KEY);

        if (raw) {
          return normalizeData(
            JSON.parse(raw)
          );
        }

        const old =
          localStorage.getItem(
            OLD_STORAGE_KEY
          );

        if (old) {
          return normalizeData(
            JSON.parse(old)
          );
        }
      } catch (error) {
        console.error(
          "Erro ao carregar dados:",
          error
        );
      }

      return defaultData();
    }

    async function saveStorage(data) {
      const serialized =
        JSON.stringify(data);

      try {
        if (
          window.storage &&
          typeof window.storage.set === "function"
        ) {
          await window.storage.set(
            STORAGE_KEY,
            serialized
          );

          return true;
        }
      } catch (error) {
        console.warn(
          "window.storage falhou:",
          error
        );
      }

      try {
        localStorage.setItem(
          STORAGE_KEY,
          serialized
        );

        return true;
      } catch (error) {
        console.error(
          "Erro ao salvar:",
          error
        );

        return false;
      }
    }


    /* ============================================================
       STREAK
       ============================================================ */

    function calculateStreak(completionDates) {
      const uniqueDates = [
        ...new Set(
          normalizeArray(
            completionDates
          )
        )
      ].sort();

      if (!uniqueDates.length) {
        return 0;
      }

      let streak = 0;

      let cursor = todayStr();

      const hasToday =
        uniqueDates.includes(cursor);

      if (!hasToday) {
        cursor = addDaysStr(
          cursor,
          -1
        );

        if (!uniqueDates.includes(cursor)) {
          return 0;
        }
      }

      while (
        uniqueDates.includes(cursor)
      ) {
        streak += 1;

        cursor = addDaysStr(
          cursor,
          -1
        );
      }

      return streak;
    }

    function markCompletionToday(data) {
      const today = todayStr();

      if (
        !data.completionDates.includes(
          today
        )
      ) {
        return {
          ...data,
          completionDates: [
            ...data.completionDates,
            today
          ]
        };
      }

      return data;
    }

    function removeCompletionToday(data) {
      const today = todayStr();

      return {
        ...data,
        completionDates:
          data.completionDates.filter(
            date => date !== today
          )
      };
    }


    /* ============================================================
       XP HISTORY
       ============================================================ */

    function addXP(
      data,
      amount,
      source,
      sourceId,
      label
    ) {
      if (!amount) {
        return data;
      }

      const alreadyExists =
        sourceId &&
        data.xpHistory.some(
          item =>
            item.source === source &&
            item.sourceId === sourceId
        );

      if (
        amount > 0 &&
        alreadyExists
      ) {
        return data;
      }

      const entry = {
        id: uid("xp"),
        date: todayStr(),
        timestamp: Date.now(),
        amount,
        source,
        sourceId: sourceId || null,
        label:
          label ||
          source
      };

      return {
        ...data,
        user: {
          ...data.user,
          xpTotal:
            Math.max(
              0,
              Number(data.user.xpTotal || 0) +
              amount
            )
        },
        xpHistory: [
          entry,
          ...data.xpHistory
        ]
      };
    }


    /* ============================================================
       EVENTOS
       ============================================================ */

    function getAllEvents(data) {
      const routine =
        normalizeArray(
          data.routineEvents
        ).map(event => ({
          ...event,
          source: "routine"
        }));

      const calendar =
        normalizeArray(
          data.calendarEvents
        ).map(event => ({
          ...event,
          source: "calendar"
        }));

      const map = new Map();

      [
        ...routine,
        ...calendar
      ].forEach(event => {
        if (!map.has(event.id)) {
          map.set(event.id, event);
        }
      });

      return [...map.values()];
    }


    function isRecurringEventOnDate(
      event,
      date
    ) {
      if (!event.repeat) {
        return event.date === date;
      }

      const repeat =
        event.repeat;

      if (
        repeat.type === "daily"
      ) {
        return (
          date >= event.date
        );
      }

      if (
        repeat.type === "weekly"
      ) {
        return (
          date >= event.date &&
          isoDayOfWeek(date) ===
          isoDayOfWeek(event.date)
        );
      }

      if (
        repeat.type === "weekdays"
      ) {
        const day =
          isoDayOfWeek(date);

        return (
          date >= event.date &&
          day >= 1 &&
          day <= 5
        );
      }

      if (
        repeat.type === "custom"
      ) {
        const weekdays =
          normalizeArray(
            repeat.weekdays
          );

        return (
          date >= event.date &&
          weekdays.includes(
            isoDayOfWeek(date)
          )
        );
      }

      return event.date === date;
    }


    function eventsForDate(
      data,
      date
    ) {
      return getAllEvents(data)
        .filter(event =>
          isRecurringEventOnDate(
            event,
            date
          )
        )
        .sort(
          (a, b) =>
            (a.start || "")
              .localeCompare(
                b.start || ""
              )
        );
    }

    /* ============================================================
       MODAL
       ============================================================ */

    function Modal({
      open,
      onClose,
      title,
      children,
      width = 600
    }) {
      const ref =
        useRef(null);

      useEffect(() => {
        if (!open) return;

        const previous =
          document.activeElement;

        setTimeout(() => {
          ref.current?.focus();
        }, 0);

        function handleKey(
          event
        ) {
          if (
            event.key ===
            "Escape"
          ) {
            onClose();
          }
        }

        document.addEventListener(
          "keydown",
          handleKey
        );

        return () => {
          document.removeEventListener(
            "keydown",
            handleKey
          );

          if (
            previous &&
            typeof previous.focus ===
              "function"
          ) {
            previous.focus();
          }
        };
      }, [
        open,
        onClose
      ]);

      if (!open) {
        return null;
      }

      return (
        <div
          className="modal-backdrop"
          onMouseDown={e => {
            if (
              e.target ===
              e.currentTarget
            ) {
              onClose();
            }
          }}
        >
          <div
            ref={ref}
            tabIndex={-1}
            role="dialog"
            aria-modal="true"
            aria-label={title}
            className="modal"
            style={{
              maxWidth: width
            }}
          >
            <div className="modal-head">
              <h2>{title}</h2>

              <IconButton
                icon={X}

    /* ============================================================
       DASHBOARD
       ============================================================ */

    function Dashboard({
      data,
      setData,
      navigate,
      notify
    }) {
      const today =
        todayStr();

      const todayEvents =
        eventsForDate(
          data,
          today
        );

      const todayQuests =
        data.quests.filter(
          quest =>
            quest.date ===
              today ||
            (
              quest.repeat &&
              isRecurringEventOnDate(
                {
                  ...quest,
                  date:
                    quest.startDate ||
                    quest.date
                },
                today
              )
            )
        );

      const completedQuests =
        todayQuests.filter(
          q => q.completed
        ).length;

      const completedEvents =
        todayEvents.filter(
          event =>
            event.completed
        ).length;

      const totalToday =
        todayEvents.length +
        todayQuests.length;

      const doneToday =
        completedEvents +
        completedQuests;

      const dayProgress =
        totalToday
          ? Math.round(
              (doneToday /
                totalToday) *
                100
            )
          : 0;

      const streak =
        calculateStreak(
          data.completionDates
        );

      const level =
        calculateLevel(
          data.user.xpTotal
        );

      const nextEvent =
        todayEvents.find(
          event =>
            !event.completed
        );

      const nextQuest =
        todayQuests.find(
          quest =>
            !quest.completed
        );

      const nextAction =
        nextQuest
          ? {
              title:
                nextQuest.title,
              type:
                "Quest",
              action:
                () =>
                  navigate(
                    "routine"
                  )
            }
          : nextEvent
          ? {
              title:
                nextEvent.title,
              type:
                "Agenda",
              action:
                () =>
                  navigate(
                    "calendar"
                  )
            }
          : null;

      const month =
        currentMonthKey();

      const monthTransactions =
        data.transactions.filter(
          item =>
            monthKey(
              item.date
            ) === month
        );

      const income =
        monthTransactions
          .filter(
            item =>
              item.type ===
              "income"
          )
          .reduce(
            (sum, item) =>
              sum +
              Number(
                item.amount
              ),
            0
          );

      const expenses =
        monthTransactions
          .filter(
            item =>
              item.type ===
              "expense"
          )
          .reduce(
            (sum, item) =>
              sum +
              Number(
                item.amount
              ),
            0
          );

      const weeklyWorkoutCount =
        data.workoutHistory.filter(
          workout =>
            daysBetween(
              workout.date,
              today
            ) >= 0 &&
            daysBetween(
              workout.date,
              today
            ) <= 6
        ).length;

      return (
        <div className="page">
          <div className="hero">
            <div>
              <div className="eyebrow">
                LIFE OS
              </div>

              <h1>
                Olá,{" "}
                {data.user.name}.
              </h1>

              <p>
                Organize seu dia.
                Faça o que importa.
                Evolua um pouco todos
                os dias.
              </p>
            </div>

            <div className="hero-stats">
              <div>
                <Flame size={17} />
                <strong>
                  {streak}
                </strong>
                <span>
                  dias
                </span>
              </div>

              <div>
                <Zap size={17} />
                <strong>
                  {data.user.xpTotal}
                </strong>
                <span>
                  XP
                </span>
              </div>

              <div>
                <Trophy size={17} />
                <strong>
                  {level.level}
                </strong>
                <span>
                  nível
                </span>
              </div>
            </div>
          </div>


          <div className="dash-grid">

            <Card
              className="span8 command-card"
              title="Próxima ação"
              icon={Target}
            >
              {nextAction ? (
                <div className="next-action">
                  <div>
                    <span className="badge">
                      {nextAction.type}
                    </span>

                    <h2>
                      {nextAction.title}
                    </h2>

                    <p>
                      Termine isso
                      antes de decidir
                      o próximo passo.
                    </p>
                  </div>

                  <Button
                    icon={Play}
                    onClick={
                      nextAction.action
                    }
                  >
                    Começar
                  </Button>
                </div>
              ) : (
                <EmptyState
                  icon={Check}
                  title="Tudo certo por enquanto"
                  text="Você não tem nenhuma ação pendente para hoje."
                  action={
                    <Button
                      icon={Plus}
                      onClick={() =>
                        navigate(
                          "routine"
                        )
                      }
                    >
                      Criar tarefa
                    </Button>
                  }
                />
              )}
            </Card>


            <Card
              className="span4"
              title="Progresso de hoje"
              icon={BarChart3}
            >
              <div className="big-number">
                {dayProgress}%
              </div>

              <ProgressBar
                value={
                  dayProgress
                }
                max={100}
              />

              <div className="muted">
                {doneToday} de{" "}
                {totalToday} itens
                concluídos
              </div>
            </Card>


            <Card
              className="span4"
              title="XP"
              icon={Zap}
            >
              <div className="level-box">
                <div className="level-number">
                  {level.level}
                </div>

                <div className="level-info">
                  <strong>
                    Nível{" "}
                    {level.level}
                  </strong>

                  <span>
                    {level.currentXP} /{" "}
                    {level.requiredXP} XP
                  </span>

                  <ProgressBar
                    value={
                      level.currentXP
                    }
                    max={
                      level.requiredXP
                    }
                    showValue={false}
                  />
                </div>
              </div>
            </Card>


            <Card
              className="span4"
              title="Treinos da semana"
              icon={Dumbbell}
            >
              <div className="big-number">
                {weeklyWorkoutCount}
              </div>

              <div className="muted">
                sessões concluídas
              </div>

              <Button
                className="mt"
                variant="ghost"
                onClick={() =>
                  navigate(
                    "workouts"
                  )
                }
              >
                Ver treinos
              </Button>
            </Card>


            <Card
              className="span4"
              title="Finanças do mês"
              icon={Wallet}
            >
              <div
                className={
                  income -
                    expenses >=
                  0
                    ? "money-positive"
                    : "money-negative"
                }
              >
                {formatMoney(
                  income -
                    expenses
                )}
              </div>

              <div className="mini-stats">
                <span>
                  Entradas{" "}
                  <strong>
                    {formatMoney(
                      income
                    )}
                  </strong>
                </span>

                <span>
                  Saídas{" "}
                  <strong>
                    {formatMoney(
                      expenses
                    )}
                  </strong>
                </span>
              </div>
            </Card>


            <Card
              className="span8"
              title="Agenda de hoje"
              icon={CalendarDays}
              action={
                <Button
                  variant="ghost"
                  onClick={() =>
                    navigate(
                      "calendar"
                    )
                  }
                >
                  Ver calendário
                </Button>
              }
            >
              {todayEvents.length ? (
                <div className="timeline">
                  {todayEvents
                    .slice(0, 6)
                    .map(event => (
                      <div
                        className={
                          "timeline-item" +
                          (event.completed
                            ? " completed"
                            : "")
                        }
                        key={
                          event.id
                        }
                      >
                        <div className="timeline-time">
                          {event.start ||
                            "—"}
                        </div>

                        <div className="timeline-dot" />

                        <div className="timeline-content">
                          <strong>
                            {
                              event.title
                            }
                          </strong>

                          <span>
                            {
                              CATEGORY_LABELS[
                                event.category
                              ] ||
                              event.category ||
                              "Geral"
                            }
                          </span>
                        </div>
                      </div>
                    ))}
                </div>
              ) : (
                <EmptyState
                  icon={CalendarDays}
                  title="Dia livre"
                  text="Você não tem eventos na agenda hoje."
                />
              )}
            </Card>


            <Card
              className="span4"
              title="Streak"
              icon={Flame}
            >
              <div className="streak">
                <Flame size={32} />
                <strong>
                  {streak}
                </strong>
                <span>
                  dias seguidos
                </span>
              </div>
            </Card>

          </div>
        </div>
      );
    }


    /* ============================================================
       ROUTINE
       ============================================================ */

    function Routine({
      data,
      setData,
      navigate,
      notify
    }) {
      const today =
        todayStr();

      const [search,
        setSearch] =
        useState("");

      const [modal,
        setModal] =
        useState(null);

      const [form,
        setForm] =
        useState({
          title: "",
          date: today,
          start: "",
          end: "",
          category: "outros",
          repeatType: "none",
          repeatWeekdays: [],
          priority: "medium",
          duration: 30
        });

      const quests =
        data.quests.filter(
          quest =>
            (
              quest.title || ""
            )
              .toLowerCase()
              .includes(
                search.toLowerCase()
              )
        );

      const events =
        getAllEvents(
          data
        ).filter(
          event =>
            (
              event.title || ""
            )
              .toLowerCase()
              .includes(
                search.toLowerCase()
              )
        );

      function resetForm() {
        setForm({
          title: "",
          date: todayStr(),
          start: "",
          end: "",
          category: "outros",
          repeatType: "none",
          repeatWeekdays: [],
          priority: "medium",
          duration: 30
        });
      }

      function openNew() {
        resetForm();
        setModal({
          type: "event"
        });
      }

      function saveEvent() {
        if (
          !form.title.trim()
        ) {
          notify(
            "Digite um título.",
            "error"
          );
          return;
        }

        if (!form.date) {
          notify(
            "Escolha uma data.",
            "error"
          );
          return;
        }

        if (
          form.start &&
          form.end
        ) {
          const start =
            parseTime(
              form.start
            );

          const end =
            parseTime(
              form.end
            );

          if (
            start == null ||
            end == null
          ) {
            notify(
              "Horário inválido.",
              "error"
            );
            return;
          }

          if (end <= start) {
            notify(
              "O horário final precisa ser depois do inicial.",
              "error"
            );
            return;
          }
        }

        const repeat =
          form.repeatType ===
          "none"
            ? null
            : {
                type:
                  form.repeatType,
                weekdays:
                  form.repeatWeekdays
              };

        const event = {
          id: uid("event"),
          title:
            form.title.trim(),
          date: form.date,
          start:
            form.start,
          end:
            form.end,
          category:
            form.category,
          priority:
            form.priority,
          duration:
            Number(
              form.duration
            ) || 0,
          repeat,
          completed: false
        };

        setData(prev => ({
          ...prev,
          routineEvents: [
            ...prev.routineEvents,
            event
          ],
          calendarEvents: [
            ...prev.calendarEvents,
            event
          ]
        }));

        setModal(null);

        notify(
          "Evento criado."
        );
      }

      function toggleEvent(
        event
      ) {
        const newCompleted =
          !event.completed;

        setData(prev => {
          let next = {
            ...prev
          };

          next.routineEvents =
            next.routineEvents.map(
              item =>
                item.id ===
                event.id
                  ? {
                      ...item,
                      completed:
                        newCompleted
                    }
                  : item
            );

          next.calendarEvents =
            next.calendarEvents.map(
              item =>
                item.id ===
                event.id
                  ? {
                      ...item,
                      completed:
                        newCompleted
                    }
                  : item
            );

          if (
            newCompleted
          ) {
            next =
              markCompletionToday(
                next
              );

            next =
              addXP(
                next,
                XP_VALUES.routine,
                "routine",
                event.id,
                `Concluído: ${event.title}`
              );
          } else {
            next =
              removeCompletionToday(
                next
              );

            const xp =
              next.xpHistory.find(
                item =>
                  item.source ===
                    "routine" &&
                  item.sourceId ===
                    event.id
              );

            if (xp) {
              next = {
                ...next,
                user: {
                  ...next.user,
                  xpTotal:
                    Math.max(
                      0,
                      next.user.xpTotal -
                        xp.amount
                    )
                },
                xpHistory:
                  next.xpHistory.filter(
                    item =>
                      item.id !==
                      xp.id
                  )
              };
            }
          }

          return next;
        });

        notify(
          newCompleted
            ? "+10 XP"
            : "Tarefa desfeita"
        );
      }

      function deleteEvent(
        event
      ) {
        if (
          !window.confirm(
            `Excluir "${event.title}"?`
          )
        ) {
          return;
        }

        setData(prev => ({
          ...prev,
          routineEvents:
            prev.routineEvents.filter(
              item =>
                item.id !==
                event.id
            ),
          calendarEvents:
            prev.calendarEvents.filter(
              item =>
                item.id !==
                event.id
            )
        }));

        notify(
          "Evento excluído."
        );
      }

      function addQuest() {
        const title =
          window.prompt(
            "Nome da tarefa:"
          );

        if (
          !title ||
          !title.trim()
        ) {
          return;
        }

        const quest = {
          id: uid("quest"),
          title:
            title.trim(),
          date: todayStr(),
          completed: false,
          priority: "medium",
          repeat: null
        };

        setData(prev => ({
          ...prev,
          quests: [
            ...prev.quests,
            quest
          ]
        }));

        notify(
          "Tarefa criada."
        );
      }

      function toggleQuest(
        quest
      ) {
        const completed =
          !quest.completed;

        setData(prev => {
          let next = {
            ...prev
          };

          next.quests =
            next.quests.map(
              item =>
                item.id ===
                quest.id
                  ? {
                      ...item,
                      completed
                    }
                  : item
            );

          if (
            completed
          ) {
            next =
              markCompletionToday(
                next
              );

            next =
              addXP(
                next,
                XP_VALUES.quest,
                "quest",
                quest.id,
                `Quest: ${quest.title}`
              );
          }

          return next;
        });

        notify(
          completed
            ? "+10 XP"
            : "Quest desmarcada"
        );
      }

      return (
        <div className="page">

          <div className="page-head">
            <div>
              <div className="eyebrow">
                ROTINA
              </div>

              <h1>
                Organize seu dia
              </h1>

              <p>
                Tarefas, compromissos
                e ações importantes
                em um só lugar.
              </p>
            </div>

            <div className="toolbar-actions">
              <Button
                icon={Plus}
                onClick={addQuest}
              >
                Nova tarefa
              </Button>

              <Button
                variant="secondary"
                icon={Plus}
                onClick={openNew}
              >
                Novo evento
              </Button>
            </div>
          </div>


          <div className="toolbar">
            <div className="search">
              <Search size={17} />

              <input
                className="input"
                value={search}
                onChange={e =>
                  setSearch(
                    e.target.value
                  )
                }
                placeholder="Buscar..."
              />
            </div>
          </div>


          <div className="two-col">

            <Card
              title="Tarefas"
              icon={Target}
            >
              {quests.length ? (
                <div className="list">
                  {quests.map(
                    quest => (
                      <div
                        className={
                          "list-item" +
                          (quest.completed
                            ? " completed"
                            : "")
                        }
                        key={
                          quest.id
                        }
                      >
                        <button
                          className={
                            "check-btn" +
                            (quest.completed
                              ? " checked"
                              : "")
                          }
                          aria-label={
                            quest.completed
                              ? "Desmarcar"
                              : "Concluir"
                          }
                          onClick={() =>
                            toggleQuest(
                              quest
                            )
                          }
                        >
                          {quest.completed && (
                            <Check
                              size={15}
                            />
                          )}
                        </button>

                        <div className="list-main">
                          <strong>
                            {
                              quest.title
                            }
                          </strong>

                          <span>
                            {quest.priority ===
                            "high"
                              ? "Alta prioridade"
                              : quest.priority ===
                                "low"
                              ? "Baixa prioridade"
                              : "Prioridade média"}
                          </span>
                        </div>
                      </div>
                    )
                  )}
                </div>
              ) : (
                <EmptyState
                  icon={Target}
                  title="Nenhuma tarefa"
                  text="Crie sua primeira tarefa para começar."
                  action={
                    <Button
                      icon={Plus}
                      onClick={
                        addQuest
                      }
                    >
                      Criar tarefa
                    </Button>
                  }
                />
              )}
            </Card>


            <Card
              title="Eventos"
              icon={CalendarDays}
            >
              {events.length ? (
                <div className="list">
                  {events.map(
                    event => (
                      <div
                        className={
                          "list-item" +
                          (event.completed
                            ? " completed"
                            : "")
                        }
                        key={
                          event.id
                        }
                      >
                        <button
                          className={
                            "check-btn" +
                            (event.completed
                              ? " checked"
                              : "")
                          }
                          onClick={() =>
                            toggleEvent(
                              event
                            )
                          }
                          aria-label="Concluir evento"
                        >
                          {event.completed && (
                            <Check
                              size={15}
                            />
                          )}
                        </button>

                        <div className="list-main">
                          <strong>
                            {
                              event.title
                            }
                          </strong>

                          <span>
                            {
                              event.date
                            }

                            {event.start &&
                              ` · ${event.start}`}

                            {event.repeat &&
                              " · Recorrente"}
                          </span>
                        </div>

                        <IconButton
                          icon={
                            Trash2
                          }
                          label="Excluir"

                          onClick={() =>
                            deleteEvent(
                              event
                            )
                          }
                        />
                      </div>
                    )
                  )}
                </div>
              ) : (
                <EmptyState
                  icon={
                    CalendarDays
                  }
                  title="Nenhum evento"
                  text="Sua agenda ainda está vazia."
                  action={
                    <Button
                      icon={Plus}
                      onClick={
                        openNew
                      }
                    >
                      Criar evento
                    </Button>
                  }
                />
              )}
            </Card>

          </div>


          <Modal
            open={
              modal?.type ===
              "event"
            }
            title="Novo evento"
            onClose={() =>
              setModal(null)
            }
          >
            <div className="form">

                onChange={value =>

                      ...prev,
                      title:
                        value
                    })

                }
              />

              <div className="form-2">
                <Input
                  label="Data"
                  type="date"
                  value={
                    form.date

                  onChange={value =>
                    setForm(
                      prev => ({
                        ...prev,
                        date:
                          value
                      })
                    )
                  }
                />

                <Select
                  label="Categoria"
                  value={
                    form.category
                  }
                  onChange={value =>
                    setForm(
                      prev => ({

                        category:

                    )

                  options={

                      "daily",

                      "Todos os dias"
                  },
                  {
                    value:
                      "weekdays",
                    label:
                      "Dias úteis"

                      "weekly",

                      "Toda semana"
                  },
                  {

                      "custom",

                      "Dias específicos"

       CALENDÁRIO

    function CalendarPage({
      data,
      setData,
      notify
    }) {
      const [weekOffset,
        setWeekOffset] =
        useState(0);

      const [modal,
        setModal] =
        useState(false);

      const [form,
        setForm] =
        useState({
          title: "",
          date:
            todayStr(),
          start: "09:00",
          end: "10:00",
          category:
            "outros"
        });

      const current =
        dateFromStr(
          todayStr()
        );

      current.setDate(
        current.getDate() +
        weekOffset * 7
      );

      const day =
        current.getDay();

      const start =
        new Date(current);

      start.setDate(
        start.getDate() -
        day
      );

      const days =
        Array.from(
          { length: 7 },
          (_, index) => {
            const d =
              new Date(start);

            d.setDate(
              start.getDate() +
              index
            );

            return d;
          }
        );

      const today =
        todayStr();

      function resetWeek() {
        setWeekOffset(0);
      }

      function createEvent() {
        if (
          !form.title.trim()
        ) {
          notify(
            "Digite um título.",
            "error"
          );

          return;
        }

        const s =
          parseTime(
            form.start
          );

        const e =
          parseTime(
            form.end
          );

        if (
          s == null ||
          e == null ||
          e <= s
        ) {
          notify(
            "Horários inválidos.",
            "error"
          );

          return;
        }

        const event = {
          id: uid("event"),
          title:
            form.title.trim(),
          date:
            form.date,
          start:
            form.start,
          end:
            form.end,
          category:
            form.category,
          completed: false
        };

        setData(prev => ({
          ...prev,
          routineEvents: [
            ...prev.routineEvents,
            event
          ],
          calendarEvents: [
            ...prev.calendarEvents,
            event
          ]
        }));

        setModal(false);

        notify(
          "Evento criado."
        );
      }

      function toggleEvent(
        event
      ) {
        const completed =
          !event.completed;

        setData(prev => {
          let next = {
            ...prev
          };

          next.routineEvents =
            prev.routineEvents.map(
              item =>
                item.id ===
                event.id
                  ? {
                      ...item,
                      completed
                    }
                  : item
            );

          next.calendarEvents =
            prev.calendarEvents.map(
              item =>
                item.id ===
                event.id
                  ? {
                      ...item,
                      completed
                    }
                  : item
            );

          if (
            completed
          ) {
            next =
              markCompletionToday(
                next
              );

            next =
              addXP(
                next,
                XP_VALUES.routine,
                "routine",
                event.id,
                `Evento: ${event.title}`
              );
          }

          return next;
        });

        notify(
          completed
            ? "+10 XP"
            : "Evento desmarcado"
        );
      }

      return (
        <div className="page">

          <div className="page-head">
            <div>
              <div className="eyebrow">
                AGENDA
              </div>

              <h1>
                Calendário
              </h1>

              <p>
                Veja sua semana
                de forma simples.
              </p>
            </div>

            <div className="toolbar-actions">
              <Button
                variant="ghost"
                onClick={() =>
                  setWeekOffset(
                    value =>
                      value - 1
                  )
                }
              >
                <ChevronLeft
                  size={17}
                />
                Semana anterior
              </Button>

              <Button
                variant="secondary"
                onClick={
                  resetWeek
                }
              >
                Hoje
              </Button>

              <Button
                variant="ghost"
                onClick={() =>
                  setWeekOffset(
                    value =>
                      value + 1
                  )
                }
              >
                Próxima semana
                <ChevronRight
                  size={17}
                />
              </Button>

              <Button
                icon={Plus}
                onClick={() =>
                  setModal(true)
                }
              >
                Evento
              </Button>
            </div>
          </div>


          <Card className="calendar-card">

            <div className="calendar-grid">

              {days.map(date => {
                const key =
                  todayStr(date);

                const events =
                  eventsForDate(
                    data,
                    key
                  );

                return (
                  <div
                    className={
                      "calendar-day" +
                      (key ===
                      today
                        ? " today"
                        : "")
                    }
                    key={key}
                  >
                    <div className="calendar-day-head">
                      <span>
                        {
                          WEEKDAYS[
                            date.getDay()
                          ]
                        }
                      </span>

                      <strong>
                        {date.getDate()}
                      </strong>
                    </div>

                    <div className="calendar-events">
                      {events.map(
                        event => (
                          <button
                            key={
                              event.id
                            }
                            className={
                              "calendar-event" +
                              (event.completed
                                ? " completed"
                                : "")
                            }
                            style={{
                              borderLeftColor:
                                CATEGORY_COLORS[
                                  event.category
                                ] ||
                                CATEGORY_COLORS.outros
                            }}
                            onClick={() =>
                              toggleEvent(
                                event
                              )
                            }
                          >
                            <strong>
                              {
                                event.title
                              }
                            </strong>

                            <span>
                              {event.start ||
                                "Dia inteiro"}
                            </span>
                          </button>
                        )
                      )}

                      {!events.length && (
                        <span className="day-empty">
                          Livre
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}

            </div>

          </Card>


          <Modal
            open={modal}
            title="Novo evento"
            onClose={() =>
              setModal(false)
            }
          >
            <div className="form">

              <Input
                label="Título"
                value={
                  form.title
                }
                onChange={value =>
                  setForm(
                    prev => ({
                      ...prev,
                      title:
                        value
                    })
                  )
                }
              />

              <Input
                label="Data"
                type="date"
                value={
                  form.date
                }
                onChange={value =>
                  setForm(
                    prev => ({
                      ...prev,
                      date:
                        value
                    })
                  )
                }
              />

              <div className="form-2">
                <Input
                  label="Início"
                  type="time"
                  value={
                    form.start
                  }
                  onChange={value =>
                    setForm(
                      prev => ({
                        ...prev,
                        start:
                          value
                      })
                    )
                  }
                />

                <Input
                  label="Fim"
                  type="time"
                  value={
                    form.end
                  }
                  onChange={value =>
                    setForm(
                      prev => ({
                        ...prev,
                        end:
                          value
                      })
                    )
                  }
                />
              </div>

              <Select
                label="Categoria"
                value={
                  form.category
                }
                onChange={value =>
                  setForm(
                    prev => ({
                      ...prev,
                      category:
                        value
                    })
                  )
                }
                options={
                  Object.entries(
                    CATEGORY_LABELS
                  ).map(
                    ([
                      value,
                      label
                    ]) => ({
                      value,
                      label
                    })
                  )
                }
              />

              <div className="modal-actions">
                <Button
                  variant="ghost"
                  onClick={() =>
                    setModal(false)
                  }
                >
                  Cancelar
                </Button>

                <Button
                  icon={Save}
                  onClick={
                    createEvent
                  }
                >
                  Salvar
                </Button>
              </div>

            </div>
          </Modal>

        </div>
      );
    }

    function Workouts({
      data,
      setData,
      notify
    }) {
      const [selected,
        setSelected] =
        useState(null);

      const [session,
        setSession] =
        useState(
          data.activeWorkoutSession
        );

      const [rest,
        setRest] =
        useState(0);

      const restRef =
        useRef(null);

      useEffect(() => {
        if (!session) {
          return;
        }

        setData(prev => ({
          ...prev,
          activeWorkoutSession:
            session
        }));
      }, [
        session
      ]);

      useEffect(() => {
        if (rest <= 0) {
          return;
        }

        restRef.current =
          setInterval(() => {
            setRest(value => {
              if (
                value <= 1
              ) {
                clearInterval(
                  restRef.current
                );

                notify(
                  "Descanso finalizado."
                );

                return 0;
              }

              return value - 1;
            });
          }, 1000);

        return () =>
          clearInterval(
            restRef.current
          );
      }, [rest]);

      function startWorkout(
        workout
      ) {
        const newSession = {
          id: uid("session"),
          workoutId:
            workout.id,
          workoutName:
            workout.name,
          startedAt:
            Date.now(),
          exercises:
            workout.exercises.map(
              exercise => ({
                ...exercise,
                sets: Array.from(
                  {
                    length:
                      Number(
                        exercise.sets
                      ) || 3
                  },
                  () => ({
                    reps:
                      Number(
                        exercise.reps
                      ) || 10,
                    weight:
                      Number(
                        exercise.weight
                      ) || 0,
                    completed:
                      false
                  })
                )
              })
            )
        };

        setSession(
          newSession
        );

        setData(prev => ({
          ...prev,
          activeWorkoutSession:
            newSession
        }));
      }

      function toggleSet(
        exerciseIndex,
        setIndex
      ) {
        setSession(prev => {
          if (!prev) {
            return prev;
          }

          const exercises =
            prev.exercises.map(
              (
                exercise,
                index
              ) => {
                if (
                  index !==
                  exerciseIndex
                ) {
                  return exercise;
                }

                return {
                  ...exercise,
                  sets:
                    exercise.sets.map(
                      (
                        item,
                        i
                      ) =>
                        i ===
                        setIndex
                          ? {
                              ...item,
                              completed:
                                !item.completed
                            }
                          : item
                    )
                };
              }
            );

          return {
            ...prev,
            exercises
          };
        });
      }

      function finishWorkout() {
        if (!session) {
          return;
        }

        const finished = {
          id: uid("history"),
          sessionId:
            session.id,
          workoutId:
            session.workoutId,
          workoutName:
            session.workoutName,
          date:
            todayStr(),
          completedAt:
            Date.now(),
          exercises:
            session.exercises
        };

        setData(prev => {
          let next = {
            ...prev,
            workoutHistory: [
              finished,
              ...prev.workoutHistory
            ],
            activeWorkoutSession:
              null
          };

          next =
            markCompletionToday(
              next
            );

          next =
            addXP(
              next,
              XP_VALUES.workout,
              "workout",
              finished.id,
              `Treino: ${finished.workoutName}`
            );

          return next;
        });

        setSession(null);

        notify(
          "+30 XP · Treino concluído!"
        );
      }

      function abandonWorkout() {
        if (
          !window.confirm(
            "Abandonar este treino? O progresso da sessão será perdido."
          )
        ) {
          return;
        }

        setSession(null);

        setData(prev => ({
          ...prev,
          activeWorkoutSession:
            null
        }));

        notify(
          "Treino descartado."
        );
      }

      function createWorkout() {
        const name =
          window.prompt(
            "Nome da ficha:"
          );

        if (
          !name ||
          !name.trim()
        ) {
          return;
        }

        const workout = {
          id: uid("workout"),
          name:
            name.trim(),
          description:
            "",
          exercises: []
        };

        setData(prev => ({
          ...prev,
          workouts: [
            ...prev.workouts,
            workout
          ]
        }));

        notify(
          "Ficha criada."
        );
      }

      function addExercise(
        workoutId
      ) {
        const name =
          window.prompt(
            "Nome do exercício:"
          );

        if (
          !name ||
          !name.trim()
        ) {
          return;
        }

        setData(prev => ({
          ...prev,
          workouts:
            prev.workouts.map(
              workout =>
                workout.id ===
                workoutId
                  ? {
                      ...workout,
                      exercises: [
                        ...workout.exercises,
                        {
                          id: uid(
                            "exercise"
                          ),
                          name:
                            name.trim(),
                          sets: 3,
                          reps: 10,
                          weight: 0
                        }
                      ]
                    }
                  : workout
            )
        }));

        notify(
          "Exercício adicionado."
        );
      }

      function deleteWorkout(
        workout
      ) {
        if (
          !window.confirm(
            `Excluir a ficha "${workout.name}"?`
          )
        ) {
          return;
        }

        setData(prev => ({
          ...prev,
          workouts:
            prev.workouts.filter(
              item =>
                item.id !==
                workout.id
            )
        }));
      }

      const history =
        data.workoutHistory;

      const weeklyVolume =
        history
          .filter(
            item =>
              daysBetween(
                item.date,
                todayStr()
              ) >= 0 &&
              daysBetween(
                item.date,
                todayStr()
              ) <= 6
          )
          .reduce(
            (total, workout) =>
              total +
              workout.exercises.reduce(
                (
                  exerciseTotal,
                  exercise
                ) =>
                  exerciseTotal +
                  exercise.sets.reduce(
                    (
                      setTotal,
                      set
                    ) =>
                      setTotal +
                      (
                        Number(
                          set.weight
                        ) || 0
                      ) *
                        (
                          Number(
                            set.reps
                          ) || 0
                        ),
                    0
                  ),
                0
              ),
            0
          );

      if (session) {
        return (
          <div className="page">

            <div className="page-head">
              <div>
                <div className="eyebrow">
                  TREINO EM ANDAMENTO
                </div>

                <h1>
                  {
                    session.workoutName
                  }
                </h1>

                <p>
                  Marque cada série
                  conforme concluir.
                </p>
              </div>

              <Button
                variant="danger"
                onClick={
                  abandonWorkout
                }
              >
                Abandonar
              </Button>
            </div>


            {rest > 0 && (
              <Card
                className="rest-card"
                title="Descanso"
                icon={Timer}
              >
                <div className="rest-timer">
                  {Math.floor(
                    rest / 60
                  )
                    .toString()
                    .padStart(
                      2,
                      "0"
                    )}
                  :
                  {(rest % 60)
                    .toString()
                    .padStart(
                      2,
                      "0"
                    )}
                </div>

                <Button
                  variant="ghost"
                  onClick={() =>
                    setRest(0)
                  }
                >
                  Pular descanso
                </Button>
              </Card>
            )}


            <div className="workout-session">

              {session.exercises.map(
                (
                  exercise,
                  exerciseIndex
                ) => (
                  <Card
                    key={
                      exercise.id
                    }
                    title={
                      exercise.name
                    }
                  >
                    <div className="sets">
                      {exercise.sets.map(
                        (
                          set,
                          setIndex
                        ) => (
                          <div
                            className={
                              "set-row" +
                              (set.completed
                                ? " completed"
                                : "")
                            }
                            key={
                              setIndex
                            }
                          >
                            <span>
                              Série{" "}
                              {setIndex +
                                1}
                            </span>

                            <strong>
                              {
                                set.reps
                              }{" "}
                              reps
                            </strong>

                            <strong>
                              {
                                set.weight
                              }{" "}
                              kg
                            </strong>

                            <Button
                              variant={
                                set.completed
                                  ? "secondary"
                                  : "ghost"
                              }
                              onClick={() =>
                                toggleSet(
                                  exerciseIndex,
                                  setIndex
                                )
                              }
                              icon={
                                Check
                              }
                            >
                              {set.completed
                                ? "Feita"
                                : "Concluir"}
                            </Button>
                          </div>
                        )
                      )}
                    </div>

                    <Button
                      variant="ghost"
                      icon={Timer}
                      onClick={() =>
                        setRest(
                          90
                        )
                      }
                    >
                      Descansar 90s
                    </Button>
                  </Card>
                )
              )}

            </div>


            <div className="sticky-bottom">
              <Button
                icon={Check}
                onClick={
                  finishWorkout
                }
              >
                Finalizar treino
              </Button>
            </div>

          </div>
        );
      }

      return (
        <div className="page">

          <div className="page-head">
            <div>
              <div className="eyebrow">
                TREINOS
              </div>

              <h1>
                Treine melhor
              </h1>

              <p>
                Fichas, histórico,
                volume e evolução.
              </p>
            </div>

            <Button
              icon={Plus}
              onClick={
                createWorkout
              }
            >
              Nova ficha
            </Button>
          </div>


          <div className="stats-grid">
            <Card
              title="Treinos realizados"
              icon={Dumbbell}
            >
              <div className="big-number">
                {
                  data.workoutHistory
                    .length
                }
              </div>
            </Card>

            <Card
              title="Volume semanal"
              icon={TrendingUp}
            >
              <div className="big-number">
                {Math.round(
                  weeklyVolume
                ).toLocaleString(
                  "pt-BR"
                )}
              </div>

              <div className="muted">
                kg × reps
              </div>
            </Card>

            <Card
              title="Em andamento"
              icon={Play}
            >
              <div className="big-number">
                {data.activeWorkoutSession
                  ? "1"
                  : "0"}
              </div>
            </Card>
          </div>


          <div className="two-col">

            <Card
              title="Minhas fichas"
              icon={Dumbbell}
            >
              {data.workouts.length ? (
                <div className="list">
                  {data.workouts.map(
                    workout => (
                      <div
                        className="list-item"
                        key={
                          workout.id
                        }
                      >
                        <div className="list-main">
                          <strong>
                            {
                              workout.name
                            }
                          </strong>

                          <span>
                            {
                              workout
                                .exercises
                                .length
                            }{" "}
                            exercícios
                          </span>
                        </div>

                        <div className="row-actions">
                          <Button
                            variant="secondary"
                            icon={
                              Play
                            }
                            onClick={() =>
                              startWorkout(
                                workout
                              )
                            }
                          >
                            Iniciar
                          </Button>

                          <IconButton
                            icon={
                              Plus
                            }
                            label="Adicionar exercício"
                            onClick={() =>
                              addExercise(
                                workout.id
                              )
                            }
                          />

                          <IconButton
                            icon={
                              Trash2
                            }
                            label="Excluir ficha"
                            danger
                            onClick={() =>
                              deleteWorkout(
                                workout
                              )
                            }
                          />
                        </div>
                      </div>
                    )
                  )}
                </div>
              ) : (
                <EmptyState
                  icon={Dumbbell}
                  title="Nenhuma ficha criada"
                  text="Crie sua primeira ficha de treino."
                  action={
                    <Button
                      icon={Plus}
                      onClick={
                        createWorkout
                      }
                    >
                      Criar ficha
                    </Button>
                  }
                />
              )}
            </Card>


            <Card
              title="Histórico"
              icon={Clock3}
            >
              {history.length ? (
                <div className="list">
                  {history
                    .slice(0, 8)
                    .map(
                      workout => (
                        <div
                          className="list-item"
                          key={
                            workout.id
                          }
                        >
                          <div className="list-main">
                            <strong>
                              {
                                workout.workoutName
                              }
                            </strong>

                            <span>
                              {
                                formatDate(
                                  workout.date
                                )
                              }
                            </span>
                          </div>

                          <span className="badge">
                            +30 XP
                          </span>
                        </div>
                      )
                    )}
                </div>
              ) : (
                <EmptyState
                  icon={Clock3}
                  title="Sem histórico"
                  text="Seus treinos concluídos aparecerão aqui."
                />
              )}
            </Card>

          </div>

        </div>
      );
    }

    function Finance({
      data,
      setData,
      notify
    }) {
      const [modal,
        setModal] =
        useState(false);

      const [form,
        setForm] =
        useState({
          type: "expense",
          amount: "",
          category:
            "alimentação",
          description: "",
          date:
            todayStr()
        });

      const month =
        currentMonthKey();

      const transactions =
        data.transactions;

      const monthTransactions =
        transactions.filter(
          item =>
            monthKey(
              item.date
            ) === month
        );

      const income =
        monthTransactions
          .filter(
            item =>
              item.type ===
              "income"
          )
          .reduce(
            (sum, item) =>
              sum +
              Number(
                item.amount
              ),
            0
          );

      const expenses =
        monthTransactions
          .filter(
            item =>
              item.type ===
              "expense"
          )
          .reduce(
            (sum, item) =>
              sum +
              Number(
                item.amount
              ),
            0
          );

      const balance =

    function AlterEgos({
      data,
      setData,
      notify
    }) {
      const [reflection,
        setReflection] =
        useState("");

      const today =
        todayStr();

      const todayReflection =
        data.reflections.find(
          item =>
            item.date ===
            today
        );

      function saveReflection() {
        if (
          !reflection.trim()
        ) {
          notify(
            "Escreva alguma coisa antes de salvar.",
            "error"
          );

          return;
        }

        setData(prev => {
          const exists =
            prev.reflections.some(
              item =>
                item.date ===
                today
            );

          let next = {
            ...prev,
            reflections: [
              ...prev.reflections.filter(
                item =>
                  item.date !==
                  today
              ),
              {
                id:
                  todayReflection?.id ||
                  uid("reflection"),
                date:
                  today,
                text:
                  reflection.trim()
              }
            ]
          };

          if (!exists) {
            next =
              markCompletionToday(
                next
              );

            next =
              addXP(
                next,
                XP_VALUES.reflection,
                "reflection",
                today,
                "Primeira reflexão do dia"
              );
          }

          return next;
        });

        setReflection("");

        notify(
          todayReflection
            ? "Reflexão atualizada."
            : "+10 XP · Reflexão salva."
        );
      }

      function chooseWinner(
        winnerId
      ) {
        setData(prev => ({
          ...prev,
          alterEgos:
            prev.alterEgos.map(
              ego =>
                ego.id ===
                winnerId
                  ? {
                      ...ego,
                      wins:
                        ego.wins +
                        1
                    }
                  : {
                      ...ego,
                      losses:
                        ego.losses +
                        1
                    }
            )
        }));

        notify(
          "Duelo registrado."
        );
      }

      return (
        <div className="page">

          <div className="page-head">
            <div>
              <div className="eyebrow">
                ALTER EGOS
              </div>

              <h1>
                Quem está no controle?
              </h1>

              <p>
                Observe os padrões,
                escolha conscientemente.
              </p>
            </div>
          </div>


          <div className="ego-duel">

            {data.alterEgos.map(
              ego => (
                <Card
                  className="ego-card"
                  key={ego.id}
                >
                  <div className="ego-icon">
                    <Shield
                      size={28}
                    />
                  </div>

                  <h2>
                    {ego.name}
                  </h2>

                  <p>
                    {
                      ego.description
                    }
                  </p>

                  <div className="ego-score">
                    <span>
                      Vitórias
                    </span>

                    <strong>
                      {ego.wins}
                    </strong>
                  </div>

                  <Button
                    onClick={() =>
                      chooseWinner(
                        ego.id
                      )
                    }
                  >
                    Escolher
                  </Button>
                </Card>
              )
            )}

          </div>


          <Card
            title="Reflexão de hoje"
            icon={BookOpen}
          >
            {todayReflection && (
              <div className="reflection-existing">
                <p>
                  {
                    todayReflection.text
                  }
                </p>

                <span>
                  Já registrada hoje.
                  Você pode substituir
                  abaixo.
                </span>
              </div>
            )}

            <Textarea
              label="O que aconteceu hoje?"
              value={
                reflection
              }
              onChange={
                setReflection
              }
              placeholder="O que você fez bem? O que poderia ter feito diferente?"
            />

            <Button
              icon={Save}
              onClick={
                saveReflection
              }
            >

            </Button>
          </Card>

        </div>
      );
    }
