    function Achievements({
      data,
      setData
    }) {
      const streak =
        calculateStreak(
          data.completionDates
        );

      const completedQuests =
        data.quests.filter(
          q => q.completed
        ).length;

      const workoutCount =
        data.workoutHistory.length;

      const reflectionCount =
        data.reflections.length;

      const unlocked =
        new Set(
          data.achievements
        );

      const status = {
        first_step:
          data.completionDates
            .length > 0,

        first_workout:
          workoutCount >= 1,

        first_reflection:
          reflectionCount >= 1,

        seven_day_streak:
          streak >= 7,

        thirty_day_streak:
          streak >= 30,

        ten_quests:
          completedQuests >= 10,

        ten_workouts:
          workoutCount >= 10
      };

      useEffect(() => {
        const newlyUnlocked =
          Object.entries(
            status
          )
            .filter(
              ([
                id,
                ok
              ]) =>
                ok &&
                !unlocked.has(
                  id
                )
            )
            .map(
              ([id]) => id
            );

        if (
          !newlyUnlocked.length
        ) {
          return;
        }

        setData(prev => ({
          ...prev,
          achievements: [
            ...prev.achievements,
            ...newlyUnlocked
          ]
        }));
      }, [
        streak,
        completedQuests,
        workoutCount,
        reflectionCount
      ]);

      return (
        <div className="page">

          <div className="page-head">
            <div>
              <div className="eyebrow">
                CONQUISTAS
              </div>

              <h1>
                Continue evoluindo
              </h1>

              <p>
                Algumas conquistas são
                desbloqueadas naturalmente.
              </p>
            </div>
          </div>


          <div className="achievement-grid">
            {ACHIEVEMENT_DEFINITIONS.map(
              achievement => {
                const Icon =
                  achievement.icon;

                const isUnlocked =
                  unlocked.has(
                    achievement.id
                  ) ||
                  status[
                    achievement.id
                  ];

                return (
                  <Card
                    key={
                      achievement.id
                    }
                    className={
                      isUnlocked
                        ? "achievement unlocked"
                        : "achievement locked"
                    }
                  >
                    <div className="achievement-icon">
                      {isUnlocked ? (
                        <Icon
                          size={27}
                        />
                      ) : (
                        <EyeOff
                          size={27}
                        />
                      )}
                    </div>

                    <h3>
                      {
                        achievement.title
                      }
                    </h3>

                    <p>
                      {
                        achievement.description
                      }
                    </p>

                    <span className="badge">
                      {isUnlocked
                        ? "Desbloqueada"
                        : `+${achievement.reward} XP`}
                    </span>
                  </Card>
                );
              }
            )}
          </div>

        </div>
      );
    }

    function SettingsPage({
      data,
      setData,
      notify
    }) {
      const fileInput =
        useRef(null);

      const [name,
        setName] =
        useState(
          data.user.name
        );

      const [budgetMonth,
        setBudgetMonth] =
        useState(
          currentMonthKey()
        );

      function saveName() {
        setData(prev => ({
          ...prev,
          user: {
            ...prev.user,
            name:
              name.trim() ||
              "Você"
          }
        }));

        notify(
          "Nome atualizado."
        );
      }

      function exportBackup() {
        const payload =
          JSON.stringify(
            data,
            null,
            2
          );

        const blob =
          new Blob(
            [payload],
            {
              type:
                "application/json"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const a =
          document.createElement(
            "a"
          );

        a.href = url;

        a.download =
          `life-os-backup-${todayStr()}.json`;

        a.click();

        URL.revokeObjectURL(
          url
        );

        notify(
          "Backup exportado."
        );
      }

      function importBackup(
        event
      ) {
        const file =
          event.target
            .files?.[0];

        if (!file) {
          return;
        }

        const reader =
          new FileReader();

        reader.onload = () => {
          try {
            const parsed =
              JSON.parse(
                reader.result
              );

            if (
              !parsed ||
              typeof parsed !==
                "object"
            ) {
              throw new Error(
                "Formato inválido."
              );
            }

            if (
              !window.confirm(
                "Importar este backup substituirá os dados atuais. Continuar?"
              )
            ) {
              return;
            }

            setData(
              normalizeData(
                parsed
              )
            );

            notify(
              "Backup importado."
            );
          } catch (error) {
            notify(
              "Backup inválido.",
              "error"
            );
          }
        };

        reader.readAsText(
          file
        );

        event.target.value =
          "";
      }

      function resetData() {
        const first =
          window.confirm(
            "Isso apagará todos os seus dados. Você já fez um backup?"
          );

        if (!first) {
          return;
        }

        const confirmation =
          window.prompt(
            "Digite APAGAR para confirmar:"
          );

        if (
          confirmation !==
          "APAGAR"
        ) {
          return;
        }

        setData(
          defaultData()
        );

        notify(
          "Todos os dados foram apagados."
        );
      }

      function updateBudget(
        category,
        value
      ) {
        setData(prev => ({
          ...prev,
          budgets: {
            ...prev.budgets,
            [budgetMonth]: {
              ...(prev.budgets[
                budgetMonth
              ] || {}),
              [category]:
                Number(value) || 0
            }
          }
        }));
      }

      return (
        <div className="page">

          <div className="page-head">
            <div>
              <div className="eyebrow">
                CONFIGURAÇÕES
              </div>

              <h1>
                Seu Life OS
              </h1>

              <p>
                Personalize e proteja
                seus dados.
              </p>
            </div>
          </div>


          <div className="two-col">

            <Card
              title="Perfil"
              icon={Settings}
            >
              <div className="form">

                <Input
                  label="Seu nome"
                  value={
                    name
                  }
                  onChange={
                    setName
                  }
                />

                <Button
                  icon={Save}
                  onClick={
                    saveName
                  }
                >
                  Salvar
                </Button>

              </div>
            </Card>


            <Card
              title="Backup"
              icon={Save}
            >
              <p className="muted">
                Seus dados são
                armazenados localmente
                neste dispositivo.
                Faça backups regularmente.
              </p>

              <div className="row-actions">
                <Button
                  icon={
                    Download
                  }
                  onClick={
                    exportBackup
                  }
                >
                  Exportar
                </Button>

                <Button
                  variant="secondary"
                  icon={
                    Upload
                  }
                  onClick={() =>
                    fileInput.current?.click()
                  }
                >
                  Importar
                </Button>
              </div>

              <input
                ref={
                  fileInput
                }
                type="file"
                accept="application/json,.json"
                hidden
                onChange={
                  importBackup
                }
              />
            </Card>


            <Card
              title="Orçamento"
              icon={Wallet}
            >

    function App() {
      const [data,
        setDataState] =
        useState(
          defaultData()
        );

      const [loaded,
        setLoaded] =
        useState(false);

      const [page,
        setPage] =
        useState(
          "dashboard"
        );

      const [mobileOpen,
        setMobileOpen] =
        useState(false);

      const [toasts,
        setToasts] =
        useState([]);

      const saveTimer =
        useRef(null);

      const notify =
        useCallback(
          (
            message,
            type = "success"
          ) => {
            const id =
              uid("toast");

            setToasts(prev => [
              ...prev,
              {
                id,
                message,
                type
              }
            ]);

            setTimeout(() => {
              setToasts(
                prev =>
                  prev.filter(
                    toast =>
                      toast.id !==
                      id
                  )
              );
            }, 3000);
          },
          []
        );

      const removeToast =
        useCallback(
          id => {
            setToasts(
              prev =>
                prev.filter(
                  toast =>
                    toast.id !==
                    id
                )
            );
          },
          []
        );

      useEffect(() => {
        loadStorage().then(
          loadedData => {
            setDataState(
              loadedData
            );

            setLoaded(true);
          }
        );
      }, []);

      const setData =
        useCallback(
          updater => {
            setDataState(
              previous => {
                const next =
                  typeof updater ===
                  "function"
                    ? updater(
                        previous
                      )
                    : updater;

                return normalizeData(
                  next
                );
              }
            );
          },
          []
        );

      useEffect(() => {
        if (!loaded) {
          return;
        }

        clearTimeout(
          saveTimer.current
        );

        saveTimer.current =
          setTimeout(
            async () => {
              const ok =
                await saveStorage(
                  data
                );

              if (!ok) {
                notify(
                  "Não foi possível salvar os dados.",
                  "error"
                );
              }
            },
            400
          );

        return () =>
          clearTimeout(
            saveTimer.current
          );
      }, [
        data,
        loaded
      ]);

      function navigate(
        nextPage
      ) {
        setPage(
          nextPage
        );
      }

      if (!loaded) {
        return (
          <>
            <style>
              {`
                body {

            </div>

      }

      let content;

                height: 28px;
                border:
                  1px solid
                  rgba(255,255,255,.13);
                border-radius: 8px;
                background:
                  transparent;
                display: grid;
                place-items: center;
                cursor: pointer;
              }

              .check-btn.checked {
                background:
                  var(--green);
                color: #06130e;
                border-color:
                  var(--green);
              }

              .row-actions {
                display: flex;
                align-items: center;
                gap: 6px;
              }

              .empty-state {
                min-height: 170px;
                display: grid;
                place-items: center;
                text-align: center;
                align-content: center;
                gap: 8px;
              }

              .empty-state h3 {
                margin: 4px 0 0;
                font-size: 14px;
              }

              .empty-state p {
                margin: 0;
                color: var(--muted);
                max-width: 360px;
                font-size: 11px;
              }

              .empty-icon {
                width: 48px;
                height: 48px;
                border-radius: 15px;
                display: grid;
                place-items: center;
                background:
                  rgba(79,125,255,.1);
                color: var(--primary);
              }

              .calendar-card {
                overflow: auto;
              }

              .calendar-grid {
                min-width: 800px;
                display: grid;
                grid-template-columns:
                  repeat(7, minmax(120px,1fr));
                gap: 8px;
              }

              .calendar-day {
                min-height: 430px;
                background:
                  rgba(255,255,255,.025);
                border:
                  1px solid
                  var(--border);
                border-radius: 13px;
                overflow: hidden;
              }

              .calendar-day.today {
                border-color:
                  rgba(79,125,255,.5);
                box-shadow:
                  inset 0 2px
                  var(--primary);
              }

              .calendar-day-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 11px;
                border-bottom:
                  1px solid
                  var(--border);
              }

              .calendar-day-head span {
                color: var(--muted);
                font-size: 9px;
                font-weight: 800;
              }

              .calendar-day-head strong {
                font-size: 18px;
              }

              .calendar-events {
                padding: 8px;
                display: grid;
                gap: 6px;
              }

              .calendar-event {
                text-align: left;
                border:
                  0;
                border-left:
                  3px solid
                  var(--primary);
                border-radius: 8px;
                background:
                  rgba(255,255,255,.045);
                padding: 8px;
                cursor: pointer;
              }

              .calendar-event.completed {
                opacity: .45;
                text-decoration:
                  line-through;
              }

              .calendar-event strong,
              .calendar-event span {
                display: block;
              }

              .calendar-event strong {
                font-size: 10px;
              }

              .calendar-event span {
                color: var(--muted);
                font-size: 9px;
                margin-top: 3px;
              }

              .day-empty {
                color: #46516a;
                font-size: 10px;
                text-align: center;
                padding: 20px 0;
              }

              .ego-duel {
                display: grid;
                grid-template-columns:
                  1fr 1fr;
                gap: 16px;
                margin-bottom: 16px;
              }

              .ego-card {
                text-align: center;
              }

              .ego-icon {
                width: 56px;
                height: 56px;
                border-radius: 18px;
                display: grid;
                place-items: center;
                margin: 0 auto 12px;
                background:
                  linear-gradient(
                    135deg,
                    rgba(79,125,255,.16),
                    rgba(139,92,246,.16)
                  );
                color: var(--cyan);
              }

              .ego-card h2 {
                margin: 0 0 7px;
              }

              .ego-card p {
                color: var(--muted);
                font-size: 11px;
                min-height: 34px;
              }

              .ego-score {
                margin:
                  15px auto;
                display: grid;
                gap: 2px;
              }

              .ego-score span {
                color: var(--muted);
                font-size: 10px;
              }

              .ego-score strong {
                font-size: 28px;
              }

              .focus-hero {
                max-width: 900px;
                margin: 0 auto;
                padding: 35px;
              }

              .focus-hero h2 {
                font-size: 30px;
                margin:
                  8px 0;
              }

              .focus-hero > p {
                color: var(--muted);
                max-width: 700px;
              }

              .next-focus {
                margin-top: 25px;
                padding: 15px;
                border:
                  1px solid
                  var(--border);
                border-radius: 13px;
                background:
                  rgba(255,255,255,.025);
                display: grid;
                gap: 5px;
              }

              .next-focus span {
                color: var(--cyan);
                font-size: 9px;
                text-transform: uppercase;
                letter-spacing: .1em;
                font-weight: 800;
              }

              .next-focus strong {
                font-size: 13px;
              }

              .achievement-grid {
                display: grid;
                grid-template-columns:
                  repeat(
                    auto-fit,
                    minmax(
                      190px,
                      1fr
                    )
                  );
                gap: 14px;
              }

              .achievement {
                text-align: center;
              }

              .achievement-icon {
                width: 56px;
                height: 56px;
                border-radius: 18px;
                display: grid;
                place-items: center;
                margin: 0 auto 13px;
              }

              .achievement.unlocked
                .achievement-icon {
                color: #ffe58a;
                background:
                  rgba(245,158,11,.13);
              }

              .achievement.locked
                .achievement-icon {
                color: #47536c;
                background:
                  rgba(255,255,255,.03);
              }

              .achievement h3 {
                margin:
                  0 0 7px;
                font-size: 13px;
              }

              .achievement p {
                color: var(--muted);
                font-size: 10px;
                min-height: 30px;
              }

              .budget-row {
                margin-bottom: 17px;
              }

              .budget-head {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 7px;
                font-size: 11px;
              }

              .budget-head span {
                color: var(--muted);
              }

              .finance-icon {
                width: 30px;
                height: 30px;
                display: grid;
                place-items: center;
                border-radius: 9px;
                background:
                  rgba(52,229,168,.08);
                color: var(--green);
                font-weight: 900;
              }

              .budget-settings {
                display: grid;
                grid-template-columns:
                  1fr 1fr;
                gap: 10px;
              }

              .rest-card {
                text-align: center;
                margin-bottom: 16px;
              }

              .rest-timer {
                font-size: 55px;
                font-weight: 900;
                letter-spacing: -.05em;
                margin:
                  5px 0 15px;
              }

              .workout-session {
                display: grid;
                gap: 14px;
              }

              .sets {
                display: grid;
                gap: 6px;
                margin-bottom: 10px;
              }

              .set-row {
                display: grid;
                grid-template-columns:
                  1fr 80px 80px auto;
                gap: 8px;
                align-items: center;
                padding: 9px;
                border-radius: 10px;
                background:
                  rgba(255,255,255,.025);
              }

              .set-row span {
                color: var(--muted);
                font-size: 10px;
              }

              .set-row strong {
                font-size: 11px;
              }

              .set-row.completed {
                opacity: .55;
              }

              .sticky-bottom {
                position: sticky;
                bottom: 15px;
                display: flex;
                justify-content: center;
                margin-top: 18px;
              }

              .reflection-existing {
                padding: 12px;
                margin-bottom: 12px;
                border:
                  1px solid
                  var(--border);
                border-radius: 12px;
              }

              .reflection-existing p {
                margin-top: 0;
              }

              .reflection-existing span {
                color: var(--muted);
                font-size: 10px;
              }

              .modal-backdrop {
                position: fixed;
                z-index: 100;
                inset: 0;
                padding: 20px;
                background:
                  rgba(0,0,0,.68);
                backdrop-filter:
                  blur(10px);
                display: grid;
                place-items: center;
              }

              .modal {
                width: 100%;
                max-height:
                  calc(100vh - 40px);
                overflow: auto;
                border:
                  1px solid
                  var(--border);
                border-radius: 18px;
                background:
                  #0c1220;
                box-shadow:
                  0 30px 100px
                  rgba(0,0,0,.5);
              }

              .modal-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding:
                  17px 19px;
                border-bottom:
                  1px solid
                  var(--border);
              }

              .modal-head h2 {
                margin: 0;
                font-size: 16px;
              }

              .modal-body {
                padding: 19px;
              }

              .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                margin-top: 5px;
              }

              .weekday-picker {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
                margin-top: 8px;
              }

              .weekday {
                border:
                  1px solid
                  var(--border);
                background:
                  rgba(255,255,255,.03);
                color: var(--muted);
                padding:
                  8px 10px;
                border-radius: 9px;
                cursor: pointer;
                font-size: 9px;
                font-weight: 800;
              }

              .weekday.selected {
                color: white;
                background:
                  rgba(79,125,255,.2);
                border-color:
                  rgba(79,125,255,.45);
              }

              .toast-wrap {
                position: fixed;
                z-index: 200;
                top: 18px;
                right: 18px;
                display: grid;
                gap: 8px;
                max-width: 360px;
              }

              .toast {
                border:
                  1px solid
                  var(--border);
                border-radius: 12px;
                background:
                  rgba(13,19,34,.94);
                color: white;
                padding:
                  11px 14px;
                display: flex;
                align-items: center;
                gap: 9px;
                cursor: pointer;
                box-shadow:
                  0 15px 40px
                  rgba(0,0,0,.25);
                text-align: left;
                font-size: 11px;
              }

              .toast-success svg {
                color: var(--green);
              }

              .toast-error svg {
                color: var(--danger);
              }

              .mt {
                margin-top: 12px;
              }

              .sidebar-overlay {
                display: none;
              }

              @media (
                max-width: 1050px
              ) {
                .sidebar {
                  width: 215px;
                }

                .main {
                  margin-left: 215px;
                }

                .page {
                  padding: 24px;
                }

                .hero {
                  align-items: flex-start;
                  flex-direction: column;
                }
              }

              @media (
                max-width: 850px
              ) {
                .sidebar {
                  transform:
                    translateX(-100%);
                  transition:
                    transform .25s ease;
                }

                .sidebar.mobile-open {
                  transform:
                    translateX(0);
                }

                .sidebar-overlay {
                  display: block;
                  position: fixed;
                  z-index: 29;
                  inset: 0;
                  background:
                    rgba(0,0,0,.55);
                }

                .main {
                  margin-left: 0;
                }

                .mobile-header {
                  display: flex;
                  position: sticky;
                  z-index: 20;
                  top: 0;
                  height: 60px;
                  align-items: center;
                  justify-content: space-between;
                  padding:
                    10px 14px;
                  background:
                    rgba(7,11,20,.88);
                  backdrop-filter:
                    blur(15px);
                  border-bottom:
                    1px solid
                    var(--border);
                }

                .mobile-brand {
                  display: flex;
                  align-items: center;
                  gap: 9px;
                  font-weight: 800;
                  letter-spacing: .08em;
                }

                .page {
                  padding: 18px;
                }

                .page-head {
                  align-items:
                    flex-start;
                  flex-direction:
                    column;
                }

                .dash-grid {
                  grid-template-columns: 1fr;
                }

                .span3,
                .span4,
                .span8 {
                  grid-column:
                    span 1;
                }

                .two-col {
                  grid-template-columns:
                    1fr;
                }

                .stats-grid {
                  grid-template-columns:
                    1fr;
                }

                .hero-stats {
                  width: 100%;
                  justify-content:
                    space-between;
                }

                .set-row {
                  grid-template-columns:
                    1fr 1fr;
                }

                .set-row .btn {
                  grid-column:
                    1 / -1;
                }
              }

              @media (
                max-width: 560px
              ) {
                .page {
                  padding: 14px;
                }

                .hero {
                  padding: 21px;
                }

                .hero h1 {
                  font-size: 27px;
                }

                .hero-stats {
                  gap: 7px;
                }

                .hero-stats > div {
                  min-width: 0;
                  flex: 1;
                }

                .page-head h1 {
                  font-size: 25px;
                }

                .toolbar-actions {
                  width: 100%;
                }

                .toolbar-actions .btn {
                  flex: 1;
                }

                .form-2 {
                  grid-template-columns:
                    1fr;
                }

                .budget-settings {
                  grid-template-columns:
                    1fr;
                }

                .ego-duel {
                  grid-template-columns:
                    1fr;
                }

                .next-action {
                  align-items:
                    flex-start;
                  flex-direction:
                    column;
                }

                .next-action .btn {
                  width: 100%;
                }

                .list-item {
                  align-items:
                    flex-start;
                }

                .row-actions {
                  flex-wrap:
                    wrap;
                }

                .toast-wrap {
                  left: 12px;
                  right: 12px;
                  top: 12px;
                  max-width: none;
                }

                .toast {
                  justify-content:
                    center;
                }

                .modal-backdrop {
                  padding: 10px;
                }

                .modal {
                  max-height:
                    calc(100vh - 20px);
                }
              }

              @media (
                prefers-reduced-motion: reduce
              ) {
                *,
                *::before,
                *::after {
                  scroll-behavior:
                    auto !important;
                  transition:
                    none !important;
                  animation:
                    none !important;
                }
              }
            `}
          </style>

          <div className="app">

            <div className="mobile-header">
              <button
                className="icon-btn"
                aria-label="Abrir menu"
                onClick={() =>
                  setMobileOpen(
                    true
                  )
                }
              >
                <Menu
                  size={20}
                />
              </button>

              <div className="mobile-brand">
                <Sparkles
                  size={17}
                />
                LIFE OS
              </div>

              <div
                style={{
                  width: 34
                }}
              />
            </div>


            <Sidebar
              page={page}
              navigate={
                navigate
              }
              mobileOpen={
                mobileOpen
              }
              closeMobile={() =>
                setMobileOpen(
                  false
                )
              }
            />


            <main className="main">
              {content}
            </main>


            <ToastContainer
              toasts={
                toasts
              }
              removeToast={
                removeToast
              }

            />

          </div>
        </>
      );
    }


    /* ============================================================
       INICIALIZAÇÃO
       ============================================================ */

    const root =
      ReactDOM.createRoot(
        document.getElementById(
          "root"
        )
      );

    root.render(
      <App />
    );

  </script>

</body>
</html>
