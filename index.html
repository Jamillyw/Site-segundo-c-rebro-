<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>LIFE OS — Seu sistema operacional pessoal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --bg-primary: #080d15;
            --bg-secondary: #0e1726;
            --bg-card: #16233a;
            --bg-card-hover: #1f2e4a;
            --bg-glass: rgba(22, 35, 58, 0.7);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #243454;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --sidebar-width: 240px;
            --header-height: 70px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-glow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(59, 130, 246, 0.15);
            --font-lg: 1.25rem;
            --font-md: 1rem;
            --font-sm: 0.875rem;
            --font-xs: 0.75rem;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            min-height: 100dvh;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: transparent; color: inherit; outline: none; }
        input, select, textarea { font-family: inherit; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 14px; border-radius: var(--radius-sm); width: 100%; font-size: var(--font-sm); transition: var(--transition); }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); outline: none; }
        textarea { resize: vertical; min-height: 80px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ===== LAYOUT ===== */
        #app { display: flex; min-height: 100vh; min-height: 100dvh; }
        #sidebar {
            width: var(--sidebar-width); background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color); height: 100vh; height: 100dvh; position: sticky; top: 0;
            display: flex; flex-direction: column; padding: 20px 0; transition: transform var(--transition), margin var(--transition); z-index: 100;
            overflow-y: auto;
        }
        #sidebar .logo { padding: 0 20px 30px 20px; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
        #sidebar .logo span { color: var(--primary); }
        .nav-links { flex: 1; padding: 0 12px; display: flex; flex-direction: column; gap: 4px; }
        .nav-links a {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm);
            font-size: var(--font-sm); font-weight: 500; color: var(--text-secondary); transition: var(--transition);
        }
        .nav-links a:hover, .nav-links a.active { background: var(--bg-card); color: var(--text-primary); }
        .nav-links a.active { box-shadow: inset 3px 0 0 var(--primary); background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .nav-links a i { width: 20px; height: 20px; }

        #sidebar-bottom { padding: 20px; border-top: 1px solid var(--border-color); margin-top: auto; display: flex; flex-direction: column; gap: 15px; }
        .user-mini { display: flex; align-items: center; gap: 12px; }
        .user-mini .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: var(--font-sm); }
        .user-mini .info { display: flex; flex-direction: column; }
        .user-mini .info .name { font-size: var(--font-sm); font-weight: 600; }
        .user-mini .info .level { font-size: var(--font-xs); color: var(--text-muted); }
        .xp-bar { height: 4px; background: var(--bg-card); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .xp-bar .fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.5s ease; }

        #main { flex: 1; padding: 20px 30px 100px 30px; overflow-y: auto; max-width: 100%; }
        #header {
            display: flex; align-items: center; justify-content: space-between; padding-bottom: 25px; border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        #header .left h1 { font-size: 1.6rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        #header .left h1 span { color: var(--text-secondary); font-weight: 400; font-size: 1rem; }
        #header .right { display: flex; align-items: center; gap: 12px; }
        #header .right .date { color: var(--text-secondary); font-size: var(--font-sm); }
        #header .right button { padding: 8px; border-radius: 50%; background: var(--bg-card); transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        #header .right button:hover { background: var(--bg-card-hover); color: var(--primary); }
        .search-box { display: flex; align-items: center; gap: 8px; background: var(--bg-card); padding: 8px 14px; border-radius: 50px; border: 1px solid var(--border-color); transition: var(--transition); }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .search-box input { border: none; background: transparent; padding: 0; width: 150px; font-size: var(--font-sm); }
        .search-box input:focus { box-shadow: none; }
        .search-box kbd { background: var(--bg-primary); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--text-muted); border: 1px solid var(--border-color); }

        /* ===== BOTTOM NAV (Mobile) ===== */
        #bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-glass); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); padding: 8px 0; justify-content: space-around; z-index: 200; }
        #bottom-nav a { display: flex; flex-direction: column; align-items: center; font-size: var(--font-xs); color: var(--text-muted); gap: 2px; padding: 6px 10px; border-radius: var(--radius-sm); transition: var(--transition); }
        #bottom-nav a i { width: 22px; height: 22px; }
        #bottom-nav a.active { color: var(--primary); background: rgba(59, 130, 246, 0.1); }

        /* ===== COMPONENTS ===== */
        .card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: var(--transition); }
        .card:hover { border-color: rgba(59, 130, 246, 0.3); box-shadow: var(--shadow-glow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h3 { font-size: var(--font-md); font-weight: 600; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); font-size: var(--font-sm); }
        .text-sm { font-size: var(--font-sm); }
        .text-xs { font-size: var(--font-xs); }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }

        .badge { display: inline-block; padding: 2px 10px; border-radius: 50px; font-size: var(--font-xs); font-weight: 600; background: var(--bg-secondary); color: var(--text-secondary); }
        .badge-primary { background: rgba(59, 130, 246, 0.2); color: var(--primary); }
        .badge-success { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-secondary { background: rgba(139, 92, 246, 0.2); color: var(--secondary); }

        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: var(--font-sm); transition: var(--transition); border: 1px solid transparent; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #2563eb; box-shadow: 0 0 15px var(--primary-glow); }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border-color); }
        .btn-secondary:hover { background: var(--bg-card-hover); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 4px 12px; font-size: var(--font-xs); }

        .progress-circle { width: 80px; height: 80px; border-radius: 50%; background: conic-gradient(var(--primary) 0%, var(--bg-card) 0%); display: flex; align-items: center; justify-content: center; position: relative; }
        .progress-circle::after { content: ''; position: absolute; width: 70px; height: 70px; background: var(--bg-card); border-radius: 50%; }
        .progress-circle .val { position: relative; z-index: 1; font-weight: 700; font-size: var(--font-lg); }

        /* ===== VIEWS ===== */
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Calendar */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-day { background: var(--bg-secondary); border-radius: 8px; padding: 8px; text-align: center; font-size: var(--font-sm); min-height: 60px; border: 1px solid transparent; transition: var(--transition); cursor: pointer; }
        .cal-day:hover { border-color: var(--primary); }
        .cal-day.other-month { color: var(--text-muted); background: transparent; }
        .cal-day.today { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
        .cal-day .dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--primary); margin: 2px; }
        .cal-day .dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; }

        /* Routine (Time Blocking) */
        .routine-grid { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; position: relative; }
        .routine-slot { display: flex; align-items: center; height: 40px; border-bottom: 1px solid var(--border-color); font-size: var(--font-xs); color: var(--text-muted); position: relative; }
        .routine-slot .time { width: 50px; flex-shrink: 0; }
        .routine-slot .bar { flex: 1; height: 100%; position: relative; border-left: 1px solid var(--border-color); margin-left: 10px; }
        .event-block { position: absolute; left: 5px; right: 5px; background: var(--primary); border-radius: 6px; padding: 2px 6px; font-size: 10px; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; z-index: 10; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: var(--transition); }
        .event-block:hover { filter: brightness(1.2); z-index: 20; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); max-width: 500px; width: 90%; padding: 30px; box-shadow: var(--shadow-glow); max-height: 90vh; overflow-y: auto; }
        .modal-box h2 { margin-bottom: 20px; }

        /* Toast */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-secondary); border: 1px solid var(--border-color); border-left: 4px solid var(--primary); padding: 12px 20px; border-radius: var(--radius-sm); box-shadow: var(--shadow-glow); animation: slideIn 0.3s ease; min-width: 200px; }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }
        .toast.danger { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Empty State */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { width: 48px; height: 48px; color: var(--border-color); margin-bottom: 16px; }
        .empty-state h4 { color: var(--text-secondary); margin-bottom: 8px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); position: fixed; width: 280px; background: var(--bg-glass); backdrop-filter: blur(16px); padding: 20px 0; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
            #sidebar.open { transform: translateX(0); }
            #main { padding: 15px 15px 90px 15px; }
            #header .left h1 { font-size: 1.2rem; }
            .search-box input { width: 100px; }
            .grid-3 { grid-template-columns: 1fr; }
            #bottom-nav { display: flex; }
            .calendar-grid { font-size: var(--font-xs); }
            .modal-box { width: 95%; padding: 20px; }
            #header .right .date { display: none; }
            .cal-day { min-height: 40px; padding: 4px; font-size: var(--font-xs); }
            .cal-day .dots { display: none; }
        }
        @media (max-width: 480px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            #header { flex-direction: column; align-items: stretch; gap: 10px; }
            #header .right { justify-content: flex-end; }
            .search-box { width: 100%; }
            .search-box input { width: 100%; }
            .routine-slot { height: 30px; }
            .routine-slot .time { width: 35px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- SIDEBAR -->
        <nav id="sidebar">
            <div class="logo">
                <i data-lucide="circuit-board" style="color:var(--primary);"></i>
                LIFE <span>OS</span>
            </div>
            <div class="nav-links">
                <a href="#/dashboard" data-route="dashboard" class="active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#/routine" data-route="routine"><i data-lucide="calendar-clock"></i> Rotina</a>
                <a href="#/calendar" data-route="calendar"><i data-lucide="calendar"></i> Calendário</a>
                <a href="#/tasks" data-route="tasks"><i data-lucide="check-square"></i> Tarefas</a>
                <a href="#/habits" data-route="habits"><i data-lucide="activity"></i> Hábitos</a>
                <a href="#/goals" data-route="goals"><i data-lucide="target"></i> Metas</a>
                <a href="#/projects" data-route="projects"><i data-lucide="kanban"></i> Projetos</a>
                <a href="#/workouts" data-route="workouts"><i data-lucide="dumbbell"></i> Treinos</a>
                <a href="#/finances" data-route="finances"><i data-lucide="wallet"></i> Finanças</a>
                <a href="#/journal" data-route="journal"><i data-lucide="book-open"></i> Diário</a>
                <a href="#/focus" data-route="focus"><i data-lucide="timer"></i> Foco</a>
                <a href="#/alter-egos" data-route="alter-egos"><i data-lucide="users"></i> Alter Egos</a>
                <a href="#/reports" data-route="reports"><i data-lucide="bar-chart-2"></i> Evolução</a>
                <a href="#/settings" data-route="settings"><i data-lucide="settings"></i> Configurações</a>
            </div>
            <div id="sidebar-bottom">
                <div class="user-mini">
                    <div class="avatar" id="sidebar-avatar">J</div>
                    <div class="info">
                        <span class="name" id="sidebar-name">Jonathan</span>
                        <span class="level" id="sidebar-level">Nível 1</span>
                    </div>
                </div>
                <div class="xp-bar"><div class="fill" id="sidebar-xp-fill" style="width: 0%;"></div></div>
            </div>
        </nav>

        <!-- MAIN -->
        <div id="main">
            <header id="header">
                <div class="left">
                    <h1 id="greeting">Bom dia<span>, Jonathan.</span></h1>
                </div>
                <div class="right">
                    <span class="date" id="current-date">00 de Mês de 2026</span>
                    <div class="search-box">
                        <i data-lucide="search" style="width:16px;height:16px;color:var(--text-muted);"></i>
                        <input type="text" id="global-search" placeholder="Buscar...">
                        <kbd>⌘K</kbd>
                    </div>
                    <button onclick="toggleSidebar()" id="sidebar-toggle"><i data-lucide="menu"></i></button>
                    <button onclick="toggleTheme()" id="theme-toggle"><i data-lucide="moon"></i></button>
                </div>
            </header>

            <div id="views">
                <!-- Views injected by JS -->
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav">
            <a href="#/dashboard"><i data-lucide="layout-dashboard"></i> Início</a>
            <a href="#/tasks"><i data-lucide="check-square"></i> Tarefas</a>
            <a href="#/routine"><i data-lucide="calendar-clock"></i> Rotina</a>
            <a href="#/finances"><i data-lucide="wallet"></i> Finanças</a>
            <a href="#/settings"><i data-lucide="settings"></i> Mais</a>
        </nav>

        <!-- MODAL -->
        <div class="modal-overlay" id="app-modal" onclick="if(event.target===this)closeModal()">
            <div class="modal-box" id="modal-content"></div>
        </div>

        <!-- TOAST -->
        <div id="toast-container"></div>
    </div>

    <script>
        // ==========================================
        // 1. STATE & STORAGE
        // ==========================================
        const STORAGE_KEY = 'lifeos_data';
        const defaultState = {
            user: { name: 'Jonathan', avatar: 'J', theme: 'dark' },
            tasks: [],
            habits: [],
            events: [],
            goals: [],
            projects: [],
            workouts: [],
            finances: { transactions: [] },
            journal: [],
            alterEgos: [],
            focusSessions: [],
            settings: { widgets: ['progress', 'routine', 'tasks', 'habits', 'focus', 'finances'] }
        };

        let AppState = JSON.parse(JSON.stringify(defaultState));

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    AppState = deepMerge(defaultState, parsed);
                } else {
                    loadDemoData();
                }
            } catch (e) {
                console.warn('Erro ao carregar dados, usando demo.');
                loadDemoData();
            }
            saveState();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
            updateSidebar();
        }

        function deepMerge(target, source) {
            const output = { ...target };
            for (let key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    output[key] = deepMerge(target[key] || {}, source[key]);
                } else {
                    output[key] = source[key];
                }
            }
            return output;
        }

        function resetState() {
            if (confirm('Isso apagará TODOS os dados locais. Tem certeza?')) {
                localStorage.removeItem(STORAGE_KEY);
                AppState = JSON.parse(JSON.stringify(defaultState));
                loadDemoData();
                renderView();
                toast('Sistema recalibrado.', 'success');
            }
        }

        // ==========================================
        // 2. DEMO DATA
        // ==========================================
        function loadDemoData() {
            const today = new Date();
            const todayStr = today.toISOString().slice(0,10);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
            const tomorrowStr = tomorrow.toISOString().slice(0,10);
            
            AppState.user = { name: 'Jonathan', avatar: 'J', theme: 'dark' };
            
            AppState.alterEgos = [
                { id: 'a1', name: 'Alfredo', desc: 'Disciplina e razão.', wins: 12, losses: 4, color: '#3b82f6' },
                { id: 'a2', name: 'Beto', desc: 'Impulso e desejo.', wins: 5, losses: 11, color: '#ef4444' }
            ];
            
            AppState.tasks = [
                { id: 't1', title: 'Definir objetivos do trimestre', desc: 'Escrever visão 3 anos.', category: 'planejamento', priority: 'high', status: 'inbox', due: todayStr, xp: 50, energy: 'high', subtasks: [] },
                { id: 't2', title: 'Estudar JavaScript avançado', desc: 'Capítulo 5 - Promises', category: 'estudos', priority: 'normal', status: 'in-progress', due: tomorrowStr, xp: 30, energy: 'medium', subtasks: [] },
                { id: 't3', title: 'Comprar mantimentos', desc: 'Arroz, feijão, legumes.', category: 'pessoal', priority: 'low', status: 'inbox', due: tomorrowStr, xp: 10, energy: 'low', subtasks: [] },
                { id: 't4', title: 'Revisar planejamento da semana', desc: '', category: 'planejamento', priority: 'critical', status: 'inbox', due: todayStr, xp: 40, energy: 'high', subtasks: [] },
            ];
            
            AppState.habits = [
                { id: 'h1', name: 'Treinar 4x semana', category: 'saúde', frequency: 'daily', history: { '2026-08-10': true, '2026-08-11': true, '2026-08-12': false }, streak: 2, bestStreak: 7 },

        // ==========================================
        // 3. UTILITIES
        // ==========================================
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
        function today() { return new Date().toISOString().slice(0,10); }
        function formatDate(d) { if(!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }); }
        function formatTime(h) { return h; }
        function formatMoney(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
        function getGreeting() { const h = new Date().getHours(); if(h < 6) return 'Boa madrugada'; if(h < 12) return 'Bom dia'; if(h < 18) return 'Boa tarde'; return 'Boa noite'; }
        function getDayData(dateStr) {
            return {
                tasks: AppState.tasks.filter(t => t.due === dateStr),
                events: AppState.events.filter(e => e.date === dateStr),
                habits: Object.fromEntries(Object.entries(AppState.habits).map(([k,v]) => [k, v.history[dateStr] || false])),
                journal: AppState.journal.filter(j => j.date === dateStr)
            };
        }
        function calcXP() {
            let total = 0;
            AppState.tasks.filter(t => t.status === 'done').forEach(t => total += t.xp || 0);
            AppState.habits.forEach(h => { if(h.history[today()]) total += 10; });
            return total;
        }
        function calcLevel(xp) {
            let level = 1; let needed = 100;
            while(xp >= needed) { xp -= needed; level++; needed += 50; }
            return { level, xp: xp, needed: needed };
        }
        function toast(msg, type='info') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            c.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; setTimeout(() => el.remove(), 300); }, 3000);
        }

        // ==========================================
        // 4. ROUTER & RENDER
        // ==========================================
        const routes = {
            'dashboard': renderDashboard,
            'routine': renderRoutine,
            'calendar': renderCalendar,
            'tasks': renderTasks,
            'habits': renderHabits,
            'goals': renderGoals,
            'projects': renderProjects,
            'workouts': renderWorkouts,
            'finances': renderFinances,
            'journal': renderJournal,
            'focus': renderFocus,
            'alter-egos': renderAlterEgos,
            'reports': renderReports,
            'settings': renderSettings
        };

        let currentView = 'dashboard';

        function navigate(hash) {
            const route = hash.replace('#/', '') || 'dashboard';
            currentView = route;
            renderView(route);
            document.querySelectorAll('#sidebar .nav-links a, #bottom-nav a').forEach(a => {
                a.classList.toggle('active', a.getAttribute('href') === '#/' + route);
            });
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function renderView(route) {
            const container = document.getElementById('views');
            container.innerHTML = '';
            const fn = routes[route] || routes['dashboard'];
            const el = document.createElement('div');
            el.className = 'view active';
            el.id = 'view-' + route;
            container.appendChild(el);
            fn(el);
            updateHeader();
            updateSidebar();
            lucide.createIcons();
            if(typeof Chart !== 'undefined') { // reset charts if any
                document.querySelectorAll('.chart-container canvas').forEach(c => {
                    if(c.chart) { c.chart.destroy(); c.chart = null; }
                });
            }
        }

        window.addEventListener('hashchange', () => navigate(window.location.hash));
        window.addEventListener('load', () => {
            loadState();
            if(!window.location.hash) window.location.hash = '#/dashboard';
            navigate(window.location.hash);
            document.addEventListener('keydown', (e) => {
                if((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('global-search').focus(); }
            });
        });

        // ==========================================
        // 5. HEADER / SIDEBAR UPDATE
        // ==========================================
        function updateHeader() {
            const now = new Date();
            const opt = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('pt-BR', opt);
            document.getElementById('greeting').innerHTML = `${getGreeting()}<span>, ${AppState.user.name}.</span>`;
        }

        function updateSidebar() {
            const xp = calcXP();
            const lvl = calcLevel(xp);
            document.getElementById('sidebar-name').textContent = AppState.user.name;
            document.getElementById('sidebar-avatar').textContent = AppState.user.avatar || AppState.user.name.slice(0,1).toUpperCase();
            document.getElementById('sidebar-level').textContent = `Nível ${lvl.level} (${lvl.xp} / ${lvl.needed} XP)`;
            document.getElementById('sidebar-xp-fill').style.width = `${(lvl.xp / lvl.needed) * 100}%`;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        function toggleTheme() {
            const c = document.documentElement.style;
            if(c.getPropertyValue('--bg-primary') === '#080d15') {
                c.setProperty('--bg-primary', '#f8fafc');
                c.setProperty('--bg-secondary', '#ffffff');
                c.setProperty('--bg-card', '#f1f5f9');
                c.setProperty('--bg-card-hover', '#e2e8f0');
                c.setProperty('--text-primary', '#0f172a');
                c.setProperty('--text-secondary', '#334155');
                c.setProperty('--text-muted', '#64748b');
                c.setProperty('--border-color', '#cbd5e1');
                c.setProperty('--bg-glass', 'rgba(255, 255, 255, 0.7)');
                document.getElementById('theme-toggle').innerHTML = '<i data-lucide="sun"></i>';
            } else {
                c.setProperty('--bg-primary', '#080d15');
                c.setProperty('--bg-secondary', '#0e1726');
                c.setProperty('--bg-card', '#16233a');
                c.setProperty('--bg-card-hover', '#1f2e4a');
                c.setProperty('--text-primary', '#f1f5f9');
                c.setProperty('--text-secondary', '#94a3b8');
                c.setProperty('--text-muted', '#64748b');
                c.setProperty('--border-color', '#243454');
                c.setProperty('--bg-glass', 'rgba(22, 35, 58, 0.7)');
                document.getElementById('theme-toggle').innerHTML = '<i data-lucide="moon"></i>';
            }
            lucide.createIcons();
        }

        // ==========================================
        // 6. MODAL SYSTEM
        // ==========================================
        function openModal(title, html, onSave) {
            const overlay = document.getElementById('app-modal');
            const box = document.getElementById('modal-content');
            const saveBtnId = uid();
            box.innerHTML = `
                <h2>${title}</h2>
                ${html}
                <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn btn-primary" id="${saveBtnId}">Salvar</button>
                </div>
            `;
            overlay.classList.add('open');
            document.getElementById(saveBtnId).addEventListener('click', () => {
                const result = onSave();
                if(result !== false) { closeModal(); saveState(); renderView(currentView); }
            });
        }

        function closeModal() {
            document.getElementById('app-modal').classList.remove('open');
        }

        // ==========================================
        // 8. TASKS
        // ==========================================
        function renderTasks(el) {
            el.innerHTML = `
                <div class="flex-between" style="margin-bottom:20px;">
                    <h2>Tarefas</h2>
                    <button class="btn btn-primary" onclick="openTaskModal()"><i data-lucide="plus"></i> Nova Tarefa</button>
                </div>
                <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
                    <button class="btn btn-secondary btn-sm filter-tasks" data-filter="all">Todas</button>
                    <button class="btn btn-secondary btn-sm filter-tasks" data-filter="inbox">Inbox</button>
                    <button class="btn btn-secondary btn-sm filter-tasks" data-filter="in-progress">Em andamento</button>
                    <button class="btn btn-secondary btn-sm filter-tasks" data-filter="done">Concluídas</button>
                </div>
                <div id="task-list"></div>
            `;

            const renderTaskList = (filter='all') => {
                const list = el.querySelector('#task-list');
                let tasks = AppState.tasks;
                if(filter !== 'all') tasks = tasks.filter(t => t.status === filter);
                if(tasks.length === 0) { list.innerHTML = `<div class="empty-state"><i data-lucide="check-square"></i><h4>Nenhuma tarefa</h4><p class="text-sm">Crie sua primeira tarefa.</p></div>`; return; }
                list.innerHTML = tasks.map(t => `
                    <div class="card" style="margin-bottom:10px;padding:15px;display:flex;justify-content:space-between;align-items:center;">
                        <div style="flex:1;">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <input type="checkbox" ${t.status==='done'?'checked':''} onchange="completeTask('${t.id}')" style="width:18px;height:18px;">
                                <span style="${t.status==='done'?'text-decoration:line-through;color:var(--text-muted);':''}"><b>${t.title}</b></span>
                                <span class="badge badge-${t.priority==='critical'?'danger':t.priority==='high'?'warning':'primary'}">${t.priority}</span>
                                ${t.due ? `<span class="badge text-xs">${formatDate(t.due)}</span>` : ''}
                            </div>
                            <div class="text-muted text-sm">${t.desc || ''}</div>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${t.id}')"><i data-lucide="pencil" style="width:14px;height:14px;"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')"><i data-lucide="trash" style="width:14px;height:14px;"></i></button>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            };

            renderTaskList('all');
            el.querySelectorAll('.filter-tasks').forEach(btn => {
                btn.addEventListener('click', () => {
                    el.querySelectorAll('.filter-tasks').forEach(b => b.classList.remove('btn-primary'));
                    btn.classList.add('btn-primary');
                    renderTaskList(btn.dataset.filter);
                });
            });
        }

        window.completeTask = (id) => {
            const t = AppState.tasks.find(t => t.id === id);
            if(t) {
                t.status = t.status === 'done' ? 'inbox' : 'done';
                if(t.status === 'done') toast('+'+t.xp+' XP', 'success');
                saveState(); renderView(currentView);
            }
        };
        window.deleteTask = (id) => {
            if(confirm('Excluir esta tarefa?')) {
                AppState.tasks = AppState.tasks.filter(t => t.id !== id);
                saveState(); renderView(currentView);
                toast('Tarefa excluída.');
            }
        };
        window.openTaskModal = (id) => {
            const t = id ? AppState.tasks.find(t => t.id === id) : null;
            const html = `
                <div style="margin-bottom:12px;"><label>Nome</label><input id="f-task-title" value="${t ? t.title : ''}" placeholder="Ex: Estudar JavaScript"></div>
                <div style="margin-bottom:12px;"><label>Descrição</label><textarea id="f-task-desc">${t ? t.desc : ''}</textarea></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div><label>Prioridade</label><select id="f-task-priority"><option value="low" ${t?.priority==='low'?'selected':''}>Baixa</option><option value="normal" ${t?.priority==='normal'?'selected':''}>Normal</option><option value="high" ${t?.priority==='high'?'selected':''}>Alta</option><option value="critical" ${t?.priority==='critical'?'selected':''}>Crítica</option></select></div>
                    <div><label>Status</label><select id="f-task-status"><option value="inbox" ${t?.status==='inbox'?'selected':''}>Inbox</option><option value="in-progress" ${t?.status==='in-progress'?'selected':''}>Em andamento</option><option value="done" ${t?.status==='done'?'selected':''}>Concluída</option></select></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
                    <div><label>Prazo</label><input type="date" id="f-task-due" value="${t ? t.due : today()}"></div>
                    <div><label>XP</label><input type="number" id="f-task-xp" value="${t ? t.xp : 20}"></div>
                </div>
            `;
            openModal(t ? 'Editar Tarefa' : 'Nova Tarefa', html, () => {
                const title = document.getElementById('f-task-title').value.trim();
                if(!title) { toast('O título é obrigatório.', 'warning'); return false; }
                const data = {
                    title, desc: document.getElementById('f-task-desc').value,
                    priority: document.getElementById('f-task-priority').value,
                    status: document.getElementById('f-task-status').value,
                    due: document.getElementById('f-task-due').value,
                    xp: parseInt(document.getElementById('f-task-xp').value) || 0,
                };
                if(t) { Object.assign(t, data); toast('Tarefa atualizada.'); }
                else { AppState.tasks.push({ id: uid(), ...data, category: 'geral', energy: 'medium', subtasks: [] }); toast('Tarefa criada!'); }
            });
        };

        window.toggleHabit = (id) => {
            const h = AppState.habits.find(h => h.id === id);
            if(h) {
                const todayStr = today();
                if(h.history[todayStr]) {
                    delete h.history[todayStr];
                    h.streak = Math.max(0, (h.streak||0) - 1);
                } else {

        function renderFocus(el) {
            el.innerHTML = `
                <h2 style="margin-bottom:20px;">Canalização / Foco</h2>
                <div class="grid-2">
                    <div class="card text-center">
                        <h3 style="font-size:3rem;font-family:monospace;" id="focus-display">25:00</h3>
                        <div style="margin-top:20px;">

                        </div>
                        <div style="margin-top:20px;">
                            <span class="badge">Tarefa atual: <span id="focus-task">Nenhuma</span></span>
                        </div>
                        <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;">
                            <button class="btn btn-secondary btn-sm" onclick="setFocusTimer(25)">25m</button>
                            <button class="btn btn-secondary btn-sm" onclick="setFocusTimer(50)">50m</button>
                            <button class="btn btn-secondary btn-sm" onclick="setFocusTimer(90)">90m</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Sessões recentes</h3></div>
                        ${AppState.focusSessions.slice(0,5).map(s => `
                            <div class="flex-between text-sm" style="padding:6px 0;border-bottom:1px solid var(--border-color);">
                                <span>${s.date}</span> <span>${s.duration} min</span>
                            </div>
                        `).join('')}
                        ${AppState.focusSessions.length === 0 ? '<div class="text-muted text-sm">Nenhuma sessão registrada.</div>' : ''}
                    </div>
                </div>
            `;
            lucide.createIcons();

            const startBtn = el.querySelector('#focus-start');
            const pauseBtn = el.querySelector('#focus-pause');
            const stopBtn = el.querySelector('#focus-stop');

            const updateDisplay = () => {
                const m = Math.floor(focusRemaining / 60);
                const s = focusRemaining % 60;
                document.getElementById('focus-display').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            };

            setFocusTimer = (m) => { clearInterval(focusTimer); focusRunning = false; focusTotal = m*60; focusRemaining = m*60; updateDisplay(); };
            setFocusTimer(25);

            startBtn.onclick = () => {
                if(focusRunning) return;
                if(focusRemaining <= 0) { setFocusTimer(25); return; }
                focusRunning = true;
                focusTimer = setInterval(() => {
                    focusRemaining--;
                    updateDisplay();
                    if(focusRemaining <= 0) {
                        clearInterval(focusTimer);
                        focusRunning = false;
                        AppState.focusSessions.push({ date: today(), duration: Math.round(focusTotal/60) });
                        saveState();
                        toast('Sessão de foco concluída! +20 XP', 'success');
                    }
                }, 1000);
            };
            pauseBtn.onclick = () => { clearInterval(focusTimer); focusRunning = false; };
            stopBtn.onclick = () => { clearInterval(focusTimer); focusRunning = false; setFocusTimer(25); };
        }

                </div>
                <div class="card mt-4">
                    <div class="card-header"><h3>Duelo do dia</h3></div>
                    <div class="flex-center" style="gap:20px;">
                        <div class="text-center"><h4>Alfredo</h4><div class="badge badge-primary">0%</div></div>
                        <div class="text-muted">VS</div>
                        <div class="text-center"><h4>Beto</h4><div class="badge badge-danger">0%</div></div>
                    </div>
                    <div class="flex-center mt-4">
                        <button class="btn btn-primary" onclick="runDuel()">Registrar quem dominou hoje</button>
                    </div>
                    <div class="text-muted text-sm text-center mt-2">Baseado nas ações concluídas hoje.</div>
                </div>
            `;
            lucide.createIcons();
        }

        window.runDuel = () => {
            const total = AppState.tasks.filter(t=>t.due===today()).length || 1;
            const done = AppState.tasks.filter(t=>t.due===today() && t.status==='done').length;
            const pct = Math.round((done/total)*100);
            const alfredo = AppState.alterEgos.find(a=>a.id==='a1');
            const beto = AppState.alterEgos.find(a=>a.id==='a2');
            if(pct >= 50) { alfredo.wins++; beto.losses++; toast(`${alfredo.name} venceu o duelo!`); }
            else { beto.wins++; alfredo.losses++; toast(`${beto.name} venceu o duelo!`); }
            saveState(); renderView(currentView);
        };

        // ==========================================
        // 19. REPORTS / EVOLUTION
        // ==========================================
        function renderReports(el) {
            const xp = calcXP();
            const lvl = calcLevel(xp);
            el.innerHTML = `
                <h2 style="margin-bottom:20px;">Relatórios & Evolução</h2>
                <div class="grid-3">
                    <div class="card"><h4>XP Total</h4><h2>${xp}</h2><div class="text-muted text-sm">Nível ${lvl.level}</div></div>
                    <div class="card"><h4>Tarefas Concluídas</h4><h2>${AppState.tasks.filter(t=>t.status==='done').length}</h2></div>
                    <div class="card"><h4>Sequência de Hábitos</h4><h2>${Math.max(...AppState.habits.map(h=>h.streak||0))}</h2></div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Progresso Semanal</h3></div>
                    <div class="chart-container" style="height:200px;"><canvas id="report-chart"></canvas></div>
                </div>
            `;
            setTimeout(() => {
                const ctx = document.getElementById('report-chart')?.getContext('2d');
                if(ctx) {
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
                            datasets: [{
                                label: 'XP',
                                data: [10, 20, 15, 30, 25, 40, 35],
                                borderColor: '#3b82f6',
                                tension: 0.3,
                                fill: true,
                                backgroundColor: 'rgba(59, 130, 246, 0.1)'
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#f1f5f9' } } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                    });
                }
            }, 100);
            lucide.createIcons();
        }

        // ==========================================
        // 20. SETTINGS
        // ==========================================
        function renderSettings(el) {
            el.innerHTML = `
                <h2 style="margin-bottom:20px;">Configurações</h2>
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header"><h3>Geral</h3></div>
                        <div style="margin-bottom:12px;"><label>Nome</label><input id="set-name" value="${AppState.user.name}"></div>
                        <button class="btn btn-primary btn-sm" onclick="updateProfile()">Atualizar Perfil</button>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Dados</h3></div>
                        <button class="btn btn-secondary w-full" onclick="exportData()">Exportar Dados (JSON)</button>
                        <button class="btn btn-secondary w-full mt-2" onclick="document.getElementById('import-file').click()">Importar Dados</button>
                        <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
                        <button class="btn btn-danger w-full mt-2" onclick="resetState()">Resetar Aplicação</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.updateProfile = () => {
            const name = document.getElementById('set-name').value.trim();
            if(name) { AppState.user.name = name; saveState(); renderView(currentView); toast('Perfil atualizado.'); }
        };

        window.exportData = () => {
            const data = JSON.stringify(AppState, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `lifeos-backup-${today()}.json`;
            a.click(); URL.revokeObjectURL(url);
            toast('Dados exportados.');
        };

        window.importData = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    AppState = deepMerge(defaultState, data);
                    saveState(); renderView(currentView);
                    toast('Dados importados com sucesso!');
                } catch(err) { toast('Erro ao importar arquivo.', 'danger'); }
            };
            reader.readAsText(file);
        };

        // ==========================================
        // 21. INITIAL BOOT
        // ==========================================
        loadState();
        if(!window.location.hash) window.location.hash = '#/dashboard';
        navigate(window.location.hash);
        document.addEventListener('keydown', (e) => {
            if((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('global-search').focus(); }
        });
        // Global Search
        document.getElementById('global-search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            if(q.length > 2) {
                const results = AppState.tasks.filter(t => t.title.toLowerCase().includes(q));
                if(results.length > 0) toast(`Encontrado: ${results[0].title}`, 'info');
            }
        });

        console.log('LIFE OS v1.0 carregado.');
        console.log('Dados:', AppState);
    </script>
</body>
</html>
