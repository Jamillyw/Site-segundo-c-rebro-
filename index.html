<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life OS</title>
<style>
:root{
  --bg:#05070d; --bg-elev:#080b16;
  --card:#0e1730; --card-2:#111b3a;
  --border: rgba(120,150,255,0.14);
  --blue:#4f7dff; --violet:#8b5cf6; --cyan:#22d3ee;
  --green:#34e5a8; --magenta:#f6408f;
  --text:#f3f6ff; --text-dim:#8fa0c8; --text-faint:#5c6a8f;
  --radius:20px; --radius-sm:13px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:
    radial-gradient(circle at 15% 0%, rgba(79,125,255,0.15), transparent 45%),
    radial-gradient(circle at 90% 20%, rgba(139,92,246,0.12), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(34,211,238,0.08), transparent 45%),
    var(--bg);
  color:var(--text); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; }
.app-shell{display:flex; min-height:100vh;}
.main-area{flex:1; min-width:0; display:flex; flex-direction:column;}
.main-content{flex:1; padding:24px 28px 60px; max-width:1400px; width:100%; margin:0 auto;}
.page{display:flex; flex-direction:column; gap:20px;}

.sidebar{
  width:250px; background:linear-gradient(180deg, #0a0f20, #070a15);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:18px 14px; position:sticky; top:0; height:100vh; transition:width .25s ease, transform .25s ease; z-index:40;
}
.sidebar-collapsed{width:84px;}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
.brand-mark{width:36px; height:36px; border-radius:12px; background:linear-gradient(135deg,var(--blue),var(--violet)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
.brand-name{font-weight:700; font-size:16px; letter-spacing:.2px;}
.sidebar-nav{display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto;}
.nav-item, .nav-subitem{
  display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border-radius:14px;
  background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; font-weight:500;
  text-align:left; transition:background .15s, color .15s;
}
.nav-item:hover, .nav-subitem:hover{background:rgba(120,150,255,0.08); color:var(--text);}
.nav-item-active{background:linear-gradient(135deg, rgba(79,125,255,0.22), rgba(139,92,246,0.14)); color:var(--text); box-shadow: inset 0 0 0 1px rgba(120,150,255,0.25);}
.nav-caret{margin-left:auto;}
.nav-submenu{display:flex; flex-direction:column; gap:2px; padding-left:14px; margin-top:2px; margin-bottom:6px; border-left:1px solid var(--border);}
.nav-submenu .nav-subitem{padding:8px 10px; font-size:13px;}
.sidebar-collapsed .nav-submenu{padding-left:0; border-left:none;}
.sidebar-collapse-btn{
  display:flex; align-items:center; gap:8px; justify-content:center; padding:10px; border-radius:12px;
  background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-size:12px;
}
.sidebar-overlay{display:none;}
.nav-group{position:relative;}
.nav-submenu-flyout{position:absolute; left:100%; top:0; margin-left:10px; background:linear-gradient(160deg,var(--card-2),var(--card)); border:1px solid var(--border); border-radius:14px; padding:8px; box-shadow:0 14px 34px rgba(0,0,0,0.45); min-width:190px; z-index:60;}
.nav-submenu-flyout .nav-subitem{padding:9px 10px;}
.sidebar-profile{display:flex; align-items:center; gap:10px; padding:10px 8px; margin-top:6px; border-top:1px solid var(--border); cursor:pointer;}
.sidebar-profile:hover{background:rgba(255,255,255,0.04); border-radius:12px;}
.sidebar-profile-name{font-size:12.5px; font-weight:600;}
.sidebar-profile-level{font-size:10.5px; color:var(--text-dim);}
.icon{display:inline-flex; width:1em; height:1em; vertical-align:-2px;}
.icon svg{width:100%; height:100%;}

.header{display:flex; align-items:center; justify-content:space-between; padding:20px 28px 4px; max-width:1400px; margin:0 auto; width:100%; gap:14px; flex-wrap:wrap;}
.header-left{display:flex; align-items:center; gap:12px;}
.header h1{font-size:22px; margin:0; font-weight:700;}
.header p{margin:2px 0 0; font-size:13px; color:var(--text-dim);}
.mobile-menu-btn{display:none; background:none; border:none; color:var(--text); cursor:pointer; padding:6px;}
.header-right{display:flex; align-items:center; gap:10px;}
.save-indicator{font-size:12px; color:var(--text-faint); min-width:80px; text-align:right;}
.level-pill{display:flex; align-items:center; gap:6px; background:linear-gradient(135deg, rgba(79,125,255,0.18), rgba(34,211,238,0.12)); border:1px solid var(--border); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
.notif-btn{position:relative;}
.notif-dot{position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--magenta); box-shadow:0 0 0 2px var(--card-2);}
.notif-section{margin-bottom:16px;}
.notif-section h4{font-size:12.5px; margin:0 0 8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}

.card{background:linear-gradient(160deg, var(--card-2), var(--card)); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:0 10px 30px rgba(0,0,0,0.25);}
.card-glow{box-shadow:0 10px 30px rgba(0,0,0,0.3), 0 0 40px rgba(79,125,255,0.08);}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.card-head h3{font-size:15px; margin:0; font-weight:700;}
.card-head h4{font-size:14px; margin:0; font-weight:700;}
.card-label{font-size:12px; margin:0 0 4px; text-transform:uppercase; letter-spacing:.06em;}

.hero-card{padding:26px;}
.hero-top{display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap;}
.hero-eyebrow{margin:0; color:var(--text-dim); font-size:12px; text-transform:capitalize;}
.hero-name{margin:4px 0 6px; font-size:24px;}
.hero-msg{margin:0; color:var(--text-dim); font-size:13px;}
.hero-level{min-width:240px;}
.hero-level-badge{display:inline-block; background:linear-gradient(135deg,var(--blue),var(--violet)); padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px; margin-bottom:8px;}
.hero-xp-row{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;}

.banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:linear-gradient(135deg, rgba(246,64,143,0.14), rgba(139,92,246,0.1)); border:1px solid rgba(246,64,143,0.3); border-radius:16px; padding:12px 16px; font-size:13px; flex-wrap:wrap;}

.dash-grid{display:grid; grid-template-columns:repeat(12,1fr); gap:18px;}
.span-3{grid-column:span 3;} .span-4{grid-column:span 4;} .span-8{grid-column:span 8;} .span-12{grid-column:span 12;}

.progress-day-row{display:flex; gap:26px; align-items:center; flex-wrap:wrap;}
.progress-day-stats{display:flex; flex-direction:column; gap:14px;}
.progress-day-stats > div{display:flex; flex-direction:column;}
.stat-big{font-size:22px; font-weight:800;}
.text-dim{color:var(--text-dim);}

.progress-track{height:8px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; transition:width .5s ease;}

.timeline{display:flex; flex-direction:column; gap:12px;}
.timeline-row{display:flex; align-items:center; gap:10px; font-size:13px;}
.timeline-time{width:44px; color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
.timeline-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.timeline-title{flex:1;}
.timeline-done{text-decoration:line-through; color:var(--text-faint);}
.timeline-lg .timeline-row-lg{background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:14px; padding:12px 14px;}
.timeline-body{flex:1; display:flex; flex-direction:column;}
.row-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

.mini-duel{display:flex; flex-wrap:wrap; gap:14px; align-items:center;}
.mini-duel-ego{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; font-weight:600;}
.avatar{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; flex-shrink:0;}
.avatar-lg{width:52px; height:52px; font-size:18px;}

.quest-mini-list{display:flex; flex-direction:column; gap:8px;}
.quest-mini{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.02); border:1px solid var(--border); padding:9px 12px; border-radius:12px; font-size:13px;}
.quest-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
.quest-card{background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px;}
.quest-card-done{opacity:.55;}
.quest-card-top{display:flex; justify-content:space-between;}
.quest-card-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:auto; flex-wrap:wrap; gap:6px;}

.badge{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:rgba(255,255,255,0.06); color:var(--text-dim); border:1px solid var(--border); white-space:nowrap;}

.btn{display:inline-flex; align-items:center; gap:7px; border-radius:12px; border:1px solid transparent; cursor:pointer; font-weight:600; transition:transform .1s, filter .15s; white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-md{padding:10px 16px; font-size:13px;}
.btn-sm{padding:7px 12px; font-size:12px;}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:rgba(255,255,255,0.04); color:var(--text); border-color:var(--border);}
.btn-danger{background:rgba(246,64,143,0.14); color:#ff8fbd; border-color:rgba(246,64,143,0.35);}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.icon-btn{background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-dim); border-radius:10px; padding:7px; cursor:pointer; display:inline-flex;}
.icon-btn:hover{color:var(--text); background:rgba(255,255,255,0.08);}
.icon-btn-danger:hover{color:#ff8fbd;}

.chk{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border); background:transparent; color:transparent; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.chk-on{background:var(--green); border-color:var(--green); color:#04150e;}

.field{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-dim); margin-bottom:12px;}
.field-label{font-weight:600;}
.input{background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text); border-radius:11px; padding:10px 12px; font-size:13px; width:100%; outline:none;}
.input:focus{border-color:var(--blue);}
.textarea{resize:vertical; font-family:inherit;}
.form-grid{display:flex; flex-direction:column;}

.tabs{display:flex; gap:6px; background:rgba(255,255,255,0.03); padding:5px; border-radius:14px; width:fit-content; border:1px solid var(--border);}
.tab{padding:8px 16px; border-radius:10px; border:none; background:transparent; color:var(--text-dim); font-weight:600; font-size:13px; cursor:pointer;}
.tab-active{background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff;}

.empty-state{padding:30px 10px; text-align:center; color:var(--text-faint); font-size:13px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(3,5,12,0.7); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:linear-gradient(160deg,var(--card-2),var(--card)); border:1px solid var(--border); border-radius:20px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal-wide{max-width:560px;}
.modal-header{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--border);}
.modal-header h3{margin:0; font-size:16px;}
.modal-body{padding:20px;}

.toast-wrap{position:fixed; top:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); padding:12px 16px; border-radius:12px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,0.4); animation:toastIn .25s ease;}
.toast-success{border-color:rgba(52,229,168,0.4); color:var(--green);}
.toast-error{border-color:rgba(246,64,143,0.4); color:#ff8fbd;}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

.ficha-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
.ficha-card{background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:16px; padding:16px;}
.ficha-ex-list{display:flex; flex-direction:column; gap:7px; margin-top:6px;}
.ficha-ex-row{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border);}
.ex-edit-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
.session-ex-row{display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer; border-bottom:1px solid var(--border);}

.hist-list{display:flex; flex-direction:column; gap:8px;}
.hist-row{display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:13px; flex-wrap:wrap; gap:8px;}

.cal-scroll{overflow-x:auto;}
.cal-grid{display:grid; min-width:820px;}
.cal-corner{height:40px;}
.cal-daylabel{height:40px; display:flex; align-items:center; justify-content:center; gap:4px; font-size:12px; font-weight:700; border-bottom:1px solid var(--border);}
.cal-today{color:var(--cyan);}
.cal-hourcol{display:flex; flex-direction:column;}
.cal-hour{height:48px; font-size:11px; color:var(--text-faint); padding-top:2px; text-align:right; padding-right:8px;}
.cal-daycol{position:relative; border-left:1px solid var(--border);}
.cal-cell{height:48px; border-bottom:1px dashed rgba(255,255,255,0.04); cursor:pointer;}
.cal-cell:hover{background:rgba(120,150,255,0.05);}
.cal-event{position:absolute; left:4px; right:4px; border-radius:8px; padding:4px 8px; font-size:11px; overflow:hidden; cursor:pointer; display:flex; align-items:flex-start; gap:6px; z-index:2;}
.cal-event strong{font-size:11.5px; display:block;}
.cal-event span{display:block;}
.cal-event-done{opacity:0.55;}
.cal-event-chk{width:16px; height:16px; border-radius:5px; border:1.5px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.2); color:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; margin-top:1px;}
.cal-event-chk.chk-on{background:var(--green); border-color:var(--green); color:#04150e;}

.duel-row{display:flex; align-items:center; justify-content:center; gap:26px; padding:10px 0 18px; flex-wrap:wrap;}
.duel-col{display:flex; flex-direction:column; align-items:center; gap:4px;}
.duel-vs{font-size:12px; color:var(--text-faint); font-weight:700;}
.ego-choice{display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:12px; border:1.5px solid var(--border); background:rgba(255,255,255,0.02); color:var(--text-dim); cursor:pointer; font-size:13px; font-weight:600;}
.ego-choice-active{color:var(--text); background:rgba(255,255,255,0.05);}

.achievement-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px;}
.achievement-card{background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:8px; opacity:.55;}
.achievement-unlocked{opacity:1; border-color:rgba(52,229,168,0.35); background:linear-gradient(160deg, rgba(52,229,168,0.08), rgba(255,255,255,0.02));}
.achievement-icon{width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; color:var(--cyan);}

.xp-history-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;}
.xp-history-row{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border);}

.type-confirm-input{margin-top:10px;}

@media (max-width: 900px){
  .dash-grid{grid-template-columns:1fr;}
  .span-3,.span-4,.span-8{grid-column:span 1;}
  .mobile-menu-btn{display:flex;}
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:20px 0 60px rgba(0,0,0,0.5);}
  .sidebar-mobile-open{transform:translateX(0);}
  .sidebar-overlay{display:block; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:39;}
  .main-content{padding:16px 14px 60px;}
  .header{padding:16px 14px 4px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-wrap"></div>

<script>
/* ============================== ICONS (tiny inline SVGs) ============================== */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',

  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 14h2"/></svg>',
  calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',

  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.2-1.6l2-1.6-2-3.4-2.4.8a7 7 0 00-2.7-1.6L13 2h-4l-.7 2.6a7 7 0 00-2.7 1.6l-2.4-.8-2 3.4 2 1.6A7 7 0 003 12c0 .5 0 1.1.2 1.6l-2 1.6 2 3.4 2.4-.8a7 7 0 002.7 1.6L9 22h4l.7-2.6a7 7 0 002.7-1.6l2.4.8 2-3.4-2-1.6c.1-.5.2-1.1.2-1.6z"/></svg>',

  chevronRight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  chevronLeft:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L19 7"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V4a1 1 0 011-1h11"/></svg>',

/* ============================== UTILITIES ============================== */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad2 = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDatePretty = (dstr) => { if(!dstr) return ""; const [y,m,d]=dstr.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}); };
const fmtCurrency = (v) => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WEEKDAYS = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const CATEGORY_COLORS = { saude:"#34e5a8", trabalho:"#4f7dff", estudo:"#8b5cf6", lazer:"#22d3ee", casa:"#f6408f", outros:"#8fa0c8" };
function addDaysStr(dstr, days){ const [y,m,d]=dstr.split("-").map(Number); const dt=new Date(y,m-1,d+days); return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function startOfWeek(dstr){ const [y,m,d]=dstr.split("-").map(Number); const dt=new Date(y,m-1,d); return addDaysStr(dstr, -dt.getDay()); }
function xpForLevel(level){ return 100 + (level-1)*50; }
function computeLevelInfo(totalXP){
  let level=1, xpIntoLevel=Math.max(0, totalXP||0);
  while(xpIntoLevel >= xpForLevel(level)){ xpIntoLevel -= xpForLevel(level); level++; }
  const xpNeeded = xpForLevel(level);
  return { level, xpIntoLevel, xpNeeded, progressPct: clamp(Math.round((xpIntoLevel/xpNeeded)*100),0,100) };
}

function dayCompleteness(d, date){
  return new Set(d.xpHistory.filter(e=>e.date===date).map(e=>e.source)).size;
}
function hasPerfectWeek(d){
  let cursor = todayStr();
  for(let i=0;i<7;i++){
    if(dayCompleteness(d,cursor) < 4) return false;
    cursor = addDaysStr(cursor,-1);
  }
  return true;
}
function comboToday(d){ return d.xpHistory.filter(e=>e.date===todayStr()).length; }

/* completionDates are DERIVED, never stored manually (fixes streak bugs) */
function computeCompletionDates(d){
  const set = new Set();
  d.events.filter(e=>e.done).forEach(e=>set.add(e.date));
  d.quests.filter(q=>q.status==="done" && q.completedAt).forEach(q=>set.add(q.completedAt));
  d.workoutSessions.forEach(s=>set.add(s.date));
  d.reflections.forEach(r=>set.add(r.date));
  (d.habitLogs||[]).forEach(l=>set.add(l.date));
  (d.focusSessions||[]).forEach(s=>set.add(s.date));
  return set;
}
function computeStreak(d){
  const set = computeCompletionDates(d);
  let streak=0, cursor=todayStr();
  while(set.has(cursor)){ streak++; cursor=addDaysStr(cursor,-1); }
  return streak;
}

/* ============================== XP LEDGER (single source of truth) ============================== */
function xpTotal(d){ return d.xpHistory.reduce((s,e)=>s+e.amount,0); }
/* grantXP is idempotent per (source+eventId) pair -> no duplicate XP ever */
function grantXP(d, source, eventId, amount, label){
  const already = d.xpHistory.some(e=>e.source===source && e.eventId===eventId);
  if(already) return false;
  d.xpHistory.push({ id:uid(), source, eventId, amount, label, date: todayStr(), ts: Date.now() });
  return true;
}
/* revokeXP removes exactly the XP previously granted for that event (undo) */
function revokeXP(d, source, eventId){
  d.xpHistory = d.xpHistory.filter(e=>!(e.source===source && e.eventId===eventId));
}

/* ============================== NOTIFICAÇÕES ============================== */
function computeNotifications(){
  if(!state) return { overdueQuests:[], upcomingEvents:[], count:0 };
  const today = todayStr();
  const now = new Date();
  const nowMinutes = now.getHours()*60+now.getMinutes();
  const overdueQuests = state.quests.filter(q=>q.status!=="done" && q.deadline && q.deadline<today);
  const upcomingEvents = state.events.filter(e=>{
    if(e.date!==today || e.done) return false;
    const [h,m] = e.start.split(":").map(Number);
    const startMin = h*60+m;
    return startMin>=nowMinutes && startMin-nowMinutes<=60;
  }).sort((a,b)=>a.start.localeCompare(b.start));
  return { overdueQuests, upcomingEvents, count: overdueQuests.length+upcomingEvents.length };
}
function openNotifPanel(){
  const n = computeNotifications();
  const today = todayStr();
  const doneToday = computeCompletionDates(state).has(today);
  const xpToday = state.xpHistory.filter(e=>e.date===today).reduce((s,e)=>s+e.amount,0);
  showModal("Notificações", `
    <div class="notif-section">
      <h4>Eventos nos próximos 60 min</h4>
      ${n.upcomingEvents.length===0 ? emptyState("Nada chegando na próxima hora") : n.upcomingEvents.map(e=>`
        <div class="quest-mini"><span class="timeline-dot" style="background:${CATEGORY_COLORS[e.category]}"></span><span style="flex:1">${esc(e.title)}</span>${badge(e.start)}</div>`).join("")}
    </div>
    <div class="notif-section">
      <h4>Tarefas atrasadas</h4>
      ${n.overdueQuests.length===0 ? emptyState("Nenhuma tarefa atrasada") : n.overdueQuests.map(q=>`
        <div class="quest-mini"><span style="flex:1">${esc(q.title)}</span>${badge("desde "+fmtDatePretty(q.deadline),"var(--magenta)")}</div>`).join("")}
    </div>
    <div class="notif-section">
      <h4>Resumo de hoje</h4>
      <p class="text-dim" style="font-size:13px">${doneToday?"Você já registrou progresso hoje.":"Ainda sem progresso hoje."} +${xpToday} XP hoje.</p>
    </div>
  `);
}
let notifiedEventIds = new Set();
let browserNotifEnabled = false;
function enableBrowserNotifications(){
  if(!("Notification" in window)){ toast("Seu navegador não suporta notificações","error"); return; }
  Notification.requestPermission().then(perm=>{
    browserNotifEnabled = perm === "granted";
    toast(browserNotifEnabled ? "Notificações ativadas" : "Permissão não concedida", browserNotifEnabled?"success":"error");
    render();
  });
}
setInterval(()=>{
  if(!state) return;
  const n = computeNotifications();
  n.upcomingEvents.forEach(e=>{
    const [h,m] = e.start.split(":").map(Number);
    const nowM = new Date().getHours()*60+new Date().getMinutes();
    const diff = (h*60+m) - nowM;
    if(diff<=15 && diff>=0 && !notifiedEventIds.has(e.id)){
      notifiedEventIds.add(e.id);
      toast(`🔔 ${e.title} em ${diff} min`);
      if(browserNotifEnabled && "Notification" in window) new Notification("Life OS", { body: `${e.title} começa em ${diff} min` });
    }
  });
  if(page==="dashboard" || page==="foco" || page==="habitos") { /* header badge refresh */ paintHeaderBadge(); }
  else paintHeaderBadge();
}, 60000);
function paintHeaderBadge(){
  const btn = document.querySelector(".notif-btn");
  if(!btn) return;
  const n = computeNotifications();
  const existingDot = btn.querySelector(".notif-dot");
  if(n.count>0 && !existingDot){ const s=document.createElement("span"); s.className="notif-dot"; btn.appendChild(s); }
  if(n.count===0 && existingDot) existingDot.remove();
}

/* small shared bits */
function progressBar(pct, color){ return `<div class="progress-track"><div class="progress-fill" style="width:${clamp(pct,0,100)}%;background:${color||"var(--cyan)"}"></div></div>`; }
function circleProgress(value, color, label, size, stroke){
  size=size||96; stroke=stroke||10;
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c-(clamp(value,0,100)/100)*c;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s ease"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column">
      <span style="font-size:20px;font-weight:700">${value}%</span>
      ${label?`<span style="font-size:10px;color:var(--text-dim)">${label}</span>`:""}
    </div></div>`;
}
function emptyState(text){ return `<div class="empty-state">${esc(text)}</div>`; }
function badge(text, color){ return `<span class="badge" ${color?`style="background:${color}22;color:${color};border-color:${color}55"`:""}>${esc(text)}</span>`; }

/* ============================== FOCO (deep work / pomodoro) ============================== */
let focusInterval = null;
function focusRing(pct, timeText){
  const size=140, stroke=12, r=(size-stroke)/2, c=2*Math.PI*r, off=c-(clamp(pct,0,100)/100)*c;
  return `<div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--cyan)" stroke-width="${stroke}" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .9s linear"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800">${timeText}</div>
  </div>`;
}
function renderFoco(){
  const sessions = state.focusSessions;
  const todayMinutes = sessions.filter(s=>s.date===todayStr()).reduce((s,x)=>s+x.minutes,0);
  const active = state.activeFocus;
  let activeBlock = "";
  if(active){
    const remaining = Math.max(0, active.durationSec - Math.floor((Date.now()-active.startedAt)/1000));
    const pct = Math.round(100 - (remaining/active.durationSec)*100);
    const min = Math.floor(remaining/60), sec = remaining%60;
    activeBlock = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0">
        <div id="focus-ring">${focusRing(pct, pad2(min)+":"+pad2(sec))}</div>
        <p class="text-dim" id="focus-label">${esc(active.label||"Sessão de foco")}</p>
        <div class="row-actions">
          <button class="btn btn-primary" onclick="finishFocus()">${ic("check",15)} Concluir</button>
          <button class="btn btn-danger" onclick="if(confirm('Cancelar sessão de foco? O progresso não será salvo.')) cancelFocus()">Cancelar</button>
        </div>
      </div>`;
  }else{
    activeBlock = `
      <p class="text-dim" style="font-size:13px;margin-bottom:14px">Escolha uma duração e elimine distrações. Foco profundo é um dos hábitos mais valiosos que você pode treinar.</p>
      <div class="row-actions" style="flex-wrap:wrap;margin-bottom:14px">
        ${[15,25,45,60].map(m=>`<button class="btn btn-ghost" onclick="startFocus(${m})">${m} min</button>`).join("")}
      </div>
      <div class="field" style="max-width:280px"><span class="field-label">Rótulo (opcional)</span><input class="input" id="focus-label-input" placeholder="Ex: Estudar programação"/></div>`;
  }
  return `
    <div class="page">
      <div class="card card-glow">
        <div class="card-head"><h3>Sessão de foco</h3></div>
        ${activeBlock}
      </div>
      <div class="dash-grid">
        <div class="card span-4"><p class="text-dim card-label">Foco hoje</p><p class="stat-big">${todayMinutes} min</p></div>
        <div class="card span-4"><p class="text-dim card-label">Sessões totais</p><p class="stat-big">${sessions.length}</p></div>
        <div class="card span-4"><p class="text-dim card-label">Total acumulado</p><p class="stat-big">${sessions.reduce((s,x)=>s+x.minutes,0)} min</p></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Histórico</h3></div>
        ${sessions.length===0 ? emptyState("Nenhuma sessão de foco ainda") : `
        <div class="hist-list">${[...sessions].reverse().slice(0,15).map(s=>`
          <div class="hist-row"><div><strong>${esc(s.label||"Foco")}</strong><p class="text-dim" style="font-size:12px">${fmtDatePretty(s.date)} · ${s.minutes} min</p></div>${badge("+"+s.xp+" XP","var(--green)")}</div>`).join("")}</div>`}
      </div>
    </div>`;
}
function startFocus(minutes){
  if(state.activeFocus){ toast("Já existe uma sessão em andamento","error"); return; }
  const labelInput = document.getElementById("focus-label-input");
  const label = labelInput ? labelInput.value : "";
  mutate(d=>{ d.activeFocus = { startedAt: Date.now(), durationSec: minutes*60, label }; });
  startFocusInterval();
}
function startFocusInterval(){
  clearInterval(focusInterval);
  focusInterval = setInterval(()=>{
    if(!state.activeFocus || page!=="foco"){ clearInterval(focusInterval); return; }
    const remaining = state.activeFocus.durationSec - Math.floor((Date.now()-state.activeFocus.startedAt)/1000);
    if(remaining<=0){ finishFocus(); return; }
    const pct = Math.round(100 - (remaining/state.activeFocus.durationSec)*100);
    const ringEl = document.getElementById("focus-ring");
    const min = Math.floor(remaining/60), sec = remaining%60;
    if(ringEl) ringEl.innerHTML = focusRing(pct, pad2(min)+":"+pad2(sec));
  }, 1000);
}
function finishFocus(){
  const active = state.activeFocus;
  if(!active) return;
  clearInterval(focusInterval);
  const elapsedMin = Math.max(1, Math.round((Date.now()-active.startedAt)/60000));
  const sessionId = uid();
  const xp = Math.max(5, Math.round(elapsedMin/5)*5);
  mutate(d=>{
    d.focusSessions.push({ id:sessionId, date:todayStr(), minutes:elapsedMin, label:active.label, xp });
    grantXP(d,"foco",sessionId,xp,active.label||"Sessão de foco");
    d.activeFocus = null;
  });
  toast(`Foco concluído! +${xp} XP`);
}
function cancelFocus(){ clearInterval(focusInterval); mutate(d=>{ d.activeFocus = null; }); }

/* ============================== HÁBITOS ============================== */
function habitStreak(habitId){
  const dates = new Set(state.habitLogs.filter(l=>l.habitId===habitId).map(l=>l.date));
  let streak=0, cursor=todayStr();
  while(dates.has(cursor)){ streak++; cursor=addDaysStr(cursor,-1); }
  return streak;
}
function renderHabitos(){
  const today = todayStr();
  const doneSet = new Set(state.habitLogs.filter(l=>l.date===today).map(l=>l.habitId));
  return `
    <div class="page">
      <div class="card">
        <div class="card-head"><h3>Hábitos diários</h3><button class="btn btn-sm btn-primary" onclick="openHabitModal(null)">${ic("plus",14)} Novo hábito</button></div>
        ${state.habits.length===0 ? emptyState("Crie seu primeiro hábito. Pequenas ações repetidas todos os dias constroem identidade.") : `
        <div class="quest-mini-list">
          ${state.habits.map(h=>{
            const done = doneSet.has(h.id);
            const streak = habitStreak(h.id);
            return `<div class="quest-mini">
              <button class="chk ${done?"chk-on":""}" onclick="toggleHabit('${h.id}')">${ic("check",13)}</button>
              <span class="timeline-dot" style="background:${h.color}"></span>
              <span style="flex:1">${esc(h.name)}</span>
              ${streak>0?badge(streak+" dias","var(--magenta)"):""}
              <button class="icon-btn" onclick="openHabitModal('${h.id}')">${ic("pencil",14)}</button>
              <button class="icon-btn icon-btn-danger" onclick="if(confirm('Excluir este hábito?')) deleteHabit('${h.id}')">${ic("trash",14)}</button>
            </div>`;
          }).join("")}
        </div>`}
      </div>
      <div class="card">
        <div class="card-head"><h3>Consistência (14 dias)</h3></div>
        ${state.habits.length===0 ? emptyState("Sem hábitos para mostrar") : state.habits.map(h=>{
          const last14 = Array.from({length:14},(_,i)=>addDaysStr(today,-(13-i)));
          const logged = new Set(state.habitLogs.filter(l=>l.habitId===h.id).map(l=>l.date));
          return `<div style="margin-bottom:14px">
            <p style="font-size:12.5px;margin-bottom:6px">${esc(h.name)}</p>
            <div style="display:flex;gap:4px">
              ${last14.map(d=>`<div style="flex:1;height:22px;border-radius:5px;background:${logged.has(d)?h.color:"rgba(255,255,255,0.06)"}"></div>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
}
function toggleHabit(id){
  const date = todayStr();
  mutate(d=>{
    const idx = d.habitLogs.findIndex(l=>l.habitId===id && l.date===date);
    if(idx>=0){ d.habitLogs.splice(idx,1); revokeXP(d,"habito", id+"|"+date); }
    else{ d.habitLogs.push({habitId:id, date}); grantXP(d,"habito", id+"|"+date, 5, (d.habits.find(h=>h.id===id)||{}).name); }
  });
}
function openHabitModal(id){
  const item = id ? state.habits.find(h=>h.id===id) : { id:null, name:"", category:"saude", color:"#22d3ee" };
  showModal(`${item.id?"Editar":"Novo"} hábito`, `
    <div class="form-grid">
      <div class="field"><span class="field-label">Nome</span><input class="input" id="h-name" value="${esc(item.name)}"/></div>
      <div class="field"><span class="field-label">Categoria</span>
        <select class="input" id="h-category">${Object.keys(CATEGORY_COLORS).map(c=>`<option value="${c}" ${item.category===c?"selected":""}>${c}</option>`).join("")}</select>
      </div>
      <div class="field"><span class="field-label">Cor</span><input class="input" type="color" id="h-color" value="${item.color}"/></div>
      <button class="btn btn-primary" onclick="saveHabitModal('${item.id||""}')">${ic("save",15)} Salvar</button>
    </div>`);
}
function saveHabitModal(id){
  const name = val("h-name");
  if(!name.trim()){ toast("Dê um nome ao hábito","error"); return; }
  const item = { name, category: val("h-category"), color: val("h-color") };
  mutate(d=>{
    if(id){ const h=d.habits.find(x=>x.id===id); Object.assign(h,item); }
    else{ d.habits.push({ ...item, id:uid() }); }
  });
  closeModal();
}
function deleteHabit(id){ mutate(d=>{ d.habits = d.habits.filter(h=>h.id!==id); d.habitLogs = d.habitLogs.filter(l=>l.habitId!==id); }); }

const PRIORITY_COLORS = { alta:"var(--magenta)", média:"#f5b942", baixa:"var(--cyan)" };
let questFilter = "todas";
function filterQuests(list){
  const today = todayStr();
  switch(questFilter){
    case "hoje": return list.filter(q=>q.status!=='done' && q.deadline===today);
    case "atrasadas": return list.filter(q=>q.status!=='done' && q.deadline && q.deadline<today);
    case "alta": return list.filter(q=>q.status!=='done' && q.priority==='alta');
    case "concluidas": return list.filter(q=>q.status==='done');
    default: return list;
  }
}

/* Unified event CRUD — shared by Rotina and Calendário so both stay in sync */

    if(!ev) return;
    if(!ev.done){ ev.done=true; grantXP(d,"rotina",ev.id,10,ev.title); toast(`+10 XP`); }
    else{ ev.done=false; revokeXP(d,"rotina",ev.id); }
  });
}
function deleteEvent(id){ mutate(d=>{ d.events = d.events.filter(e=>e.id!==id); revokeXP(d,"rotina",id); }); }
function deleteEventSeries(seriesId){

    const toRemove = d.events.filter(e=>e.seriesId===seriesId && e.date>=todayStr());
    toRemove.forEach(e=>revokeXP(d,"rotina",e.id));
    d.events = d.events.filter(e=>!(e.seriesId===seriesId && e.date>=todayStr()));
  });
}

function saveEventModal(id){
  const item = { title: val("f-title"), date: val("f-date"), start: val("f-start"), end: val("f-end"), category: val("f-category") };
  if(!item.title.trim()){ toast("Dê um título ao evento", "error"); return; }
  if(item.end <= item.start){ toast("O horário final deve ser depois do inicial", "error"); return; }
  if(id){
    mutate(d=>{ const ev=d.events.find(e=>e.id===id); Object.assign(ev,item); });
    closeModal();
    return;
  }
  const repeatEl = document.getElementById("f-repeat");
  const repeat = repeatEl ? repeatEl.value : "nunca";
  if(repeat==="nunca"){
    mutate(d=>{ d.events.push({ ...item, id:uid(), done:false }); });
    closeModal();
    return;
  }
  let allowedWeekdays = null;
  if(repeat==="uteis") allowedWeekdays = [1,2,3,4,5];
  else if(repeat==="personalizado"){
    allowedWeekdays = Array.from(document.querySelectorAll(".f-repeat-day:checked")).map(el=>Number(el.value));
    if(allowedWeekdays.length===0){ toast("Selecione ao menos um dia da semana","error"); return; }
  }
  const seriesId = uid();
  const horizonDays = repeat==="semanal" ? 365 : 90;
  const occurrences = [];
  for(let i=0; i<horizonDays; i++){
    const d = addDaysStr(item.date, i);
    const wd = new Date(d+"T00:00:00").getDay();
    let include = false;
    if(repeat==="diario") include = true;
    else if(repeat==="uteis") include = allowedWeekdays.includes(wd);
    else if(repeat==="semanal") include = wd === new Date(item.date+"T00:00:00").getDay();
    else if(repeat==="personalizado") include = allowedWeekdays.includes(wd);
    if(include) occurrences.push({ ...item, date:d, id:uid(), done:false, seriesId });
  }
  mutate(d=>{ d.events.push(...occurrences); });
  toast(`${occurrences.length} eventos criados na série`);
  closeModal();
}

  let startedRest = false;
  mutate(d=>{

    if(s.done){ d.activeSession.restUntil = Date.now() + d.activeSession.restSeconds*1000; startedRest = true; }

  openActiveSessionModal();
  if(startedRest) startRestInterval();

function skipRest(){ mutate(d=>{ d.activeSession.restUntil = null; }); clearInterval(restInterval); openActiveSessionModal(); }
let restInterval = null;
function startRestInterval(){
  clearInterval(restInterval);
  restInterval = setInterval(()=>{
    if(!state.activeSession || !state.activeSession.restUntil) { clearInterval(restInterval); return; }
    const remaining = Math.max(0, Math.round((state.activeSession.restUntil - Date.now())/1000));
    const el = document.getElementById("rest-countdown");
    if(el) el.textContent = `${pad2(Math.floor(remaining/60))}:${pad2(remaining%60)}`;
    if(remaining<=0){
      clearInterval(restInterval);
      mutate(d=>{ if(d.activeSession) d.activeSession.restUntil = null; });
      openActiveSessionModal();
    }
  }, 500);
}

function finishSession(){
  clearInterval(restInterval);
  const s = state.activeSession;
  const elapsedMin = Math.max(1, Math.round((Date.now()-s.startedAt)/60000));
  const exercisesDone = s.exercises.filter(ex=>ex.series.every(set=>set.done)).length;
  const totalLoad = s.exercises.reduce((sum,ex)=>sum+ex.series.filter(set=>set.done).reduce((ss,set)=>ss+(set.reps*set.load),0),0);
  const setsDone = s.exercises.reduce((sum,ex)=>sum+ex.series.filter(set=>set.done).length,0);
  const xp = 20 + setsDone*5;
  const sessionId = uid();
  mutate(d=>{
    d.workoutSessions.push({ id:sessionId, fichaId:s.fichaId, fichaName:s.fichaName, date:todayStr(), durationMin:elapsedMin, exercisesDone, exercisesTotal:s.exercises.length, totalLoad, xp });
    grantXP(d,"treino",sessionId,xp,s.fichaName);
    d.activeSession = null;
  });

}
function cancelActiveSession(){ clearInterval(restInterval); mutate(d=>{ d.activeSession = null; }); closeModal(); }

/* ============================== FINANÇAS ============================== */
function renderFinancas(){
  const receitas = state.financeTransactions.filter(t=>t.type==="receita").reduce((s,t)=>s+t.amount,0);
  const despesas = state.financeTransactions.filter(t=>t.type==="despesa").reduce((s,t)=>s+t.amount,0);
  const saldo = receitas - despesas;
  const monthMap = {};
  [...state.financeTransactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    const k=t.date.slice(0,7); monthMap[k]=(monthMap[k]||0)+(t.type==="receita"?t.amount:-t.amount);
  });
  let cum=0; const monthly = Object.entries(monthMap).map(([k,v])=>{ cum+=v; return [k,cum]; });
  const maxAbs = Math.max(1, ...monthly.map(([,v])=>Math.abs(v)));
  const filtered = state.financeTransactions.filter(t=>(financeFilterType==="todos"||t.type===financeFilterType) && (!financeFilterMonth || t.date.slice(0,7)===financeFilterMonth)).sort((a,b)=>b.date.localeCompare(a.date));

  return `
    <div class="page">
      <div class="dash-grid">
        <div class="card span-4 card-glow"><p class="text-dim card-label">Saldo</p><p class="stat-big" style="font-size:28px;color:${saldo>=0?"var(--green)":"var(--magenta)"}">${fmtCurrency(saldo)}</p></div>
        <div class="card span-4"><p class="text-dim card-label">Receitas</p><p class="stat-big" style="color:var(--green)">${fmtCurrency(receitas)}</p></div>
        <div class="card span-4"><p class="text-dim card-label">Despesas</p><p class="stat-big" style="color:var(--magenta)">${fmtCurrency(despesas)}</p></div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Evolução do saldo</h3></div>
        ${monthly.length===0 ? emptyState("Adicione lançamentos para ver o gráfico") : `
          <div style="display:flex;gap:12px;align-items:flex-end;height:160px;padding-top:10px">
            ${monthly.map(([k,v])=>`
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
                <span class="text-dim" style="font-size:10px">${fmtCurrency(v)}</span>
                <div style="width:100%;border-radius:6px 6px 0 0;background:${v>=0?"linear-gradient(180deg,var(--cyan),var(--green))":"linear-gradient(180deg,var(--magenta),#a83266)"};height:${Math.max(4,(Math.abs(v)/maxAbs)*110)}px"></div>
                <span class="text-dim" style="font-size:10px">${k}</span>
              </div>`).join("")}
          </div>`}
      </div>

      <div class="card">
        <div class="card-head"><h3>Orçamento do mês</h3><button class="btn btn-sm btn-ghost" onclick="openBudgetModal()">${ic("plus",14)} Definir orçamento</button></div>
        ${renderBudgetList()}
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Lançamentos</h3>
          <div class="row-actions">
            <select class="input" style="width:130px" onchange="financeFilterType=this.value;render();">
              <option value="todos" ${financeFilterType==='todos'?'selected':''}>Todos</option>
              <option value="receita" ${financeFilterType==='receita'?'selected':''}>Receitas</option>
              <option value="despesa" ${financeFilterType==='despesa'?'selected':''}>Despesas</option>
            </select>
            <input class="input" type="month" style="width:150px" value="${financeFilterMonth}" onchange="financeFilterMonth=this.value;render();"/>
            <button class="btn btn-sm btn-primary" onclick="openTransactionModal(null)">${ic("plus",14)} Novo lançamento</button>
          </div>
        </div>
        ${filtered.length===0 ? emptyState("Nenhuma movimentação registrada.") : `
          <div class="hist-list">${filtered.map(t=>`
            <div class="hist-row">
              <div><strong>${esc(t.description)}</strong><p class="text-dim" style="font-size:12px">${fmtDatePretty(t.date)} · ${esc(t.category)}</p></div>
              <div class="row-actions">
                <span style="color:${t.type==='receita'?'var(--green)':'var(--magenta)'};font-weight:600">${t.type==='receita'?'+':'-'}${fmtCurrency(t.amount)}</span>
                <button class="icon-btn" onclick="openTransactionModal('${t.id}')">${ic("pencil",15)}</button>
                <button class="icon-btn icon-btn-danger" onclick="if(confirm('Excluir este lançamento?')) deleteTransaction('${t.id}')">${ic("trash",15)}</button>
              </div>
            </div>`).join("")}</div>`}
      </div>
    </div>`;
}
function renderBudgetList(){
  const budgets = state.budgets || {};
  const cats = Object.keys(budgets).filter(c=>budgets[c]>0);
  if(cats.length===0) return emptyState("Nenhum orçamento definido. Defina limites por categoria para acompanhar seus gastos.");
  const thisMonth = todayStr().slice(0,7);
  return cats.map(cat=>{
    const spent = state.financeTransactions.filter(t=>t.type==="despesa" && t.category===cat && t.date.slice(0,7)===thisMonth).reduce((s,t)=>s+t.amount,0);
    const limit = budgets[cat];
    const pct = limit>0 ? Math.round((spent/limit)*100) : 0;
    const over = spent > limit;
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
        <span>${esc(cat)}</span><span class="text-dim">${fmtCurrency(spent)} / ${fmtCurrency(limit)}</span>
      </div>
      ${progressBar(pct, over?"var(--magenta)":"var(--cyan)")}
    </div>`;
  }).join("");
}
function openBudgetModal(){
  const budgets = state.budgets || {};
  showModal("Orçamento mensal", `
    <div class="form-grid">
      ${Object.keys(CATEGORY_COLORS).map(c=>`
        <div class="field"><span class="field-label">${c}</span><input class="input" type="number" id="b-${c}" value="${budgets[c]||0}"/></div>
      `).join("")}
      <button class="btn btn-primary" onclick="saveBudgets()">${ic("save",15)} Salvar orçamento</button>
    </div>`);
}
function saveBudgets(){
  const newBudgets = {};
  Object.keys(CATEGORY_COLORS).forEach(c=>{ const v = Number(val("b-"+c)); if(v>0) newBudgets[c]=v; });
  mutate(d=>{ d.budgets = newBudgets; });
  closeModal();
}
function openTransactionModal(id){
  const item = id ? state.financeTransactions.find(t=>t.id===id) : { id:null, date:todayStr(), type:"despesa", category:"outros", description:"", amount:0 };
  showModal(`${item.id?"Editar":"Novo"} lançamento`, `
    <div class="form-grid">
      <div class="field"><span class="field-label">Descrição</span><input class="input" id="f-desc" value="${esc(item.description)}"/></div>
      <div class="field"><span class="field-label">Valor</span><input class="input" type="number" id="f-amount" value="${item.amount}"/></div>
      <div class="field"><span class="field-label">Tipo</span>
        <select class="input" id="f-type"><option value="receita" ${item.type==='receita'?'selected':''}>Receita</option><option value="despesa" ${item.type==='despesa'?'selected':''}>Despesa</option></select>
      </div>
      <div class="field"><span class="field-label">Categoria</span><input class="input" id="f-cat" value="${esc(item.category)}"/></div>
      <div class="field"><span class="field-label">Data</span><input class="input" type="date" id="f-date" value="${item.date}"/></div>
      <button class="btn btn-primary" onclick="saveTransactionModal('${item.id||""}')">${ic("save",15)} Salvar</button>
    </div>`);
}
function saveTransactionModal(id){
  const item = { description: val("f-desc"), amount: Number(val("f-amount")), type: val("f-type"), category: val("f-cat"), date: val("f-date") };
  if(!item.description.trim()){ toast("Dê uma descrição","error"); return; }
  mutate(d=>{
    if(id){ const t=d.financeTransactions.find(x=>x.id===id); Object.assign(t,item); }
    else{ d.financeTransactions.push({ ...item, id:uid() }); }
  });
  closeModal();
}
function deleteTransaction(id){ mutate(d=>{ d.financeTransactions = d.financeTransactions.filter(t=>t.id!==id); }); }

/* ============================== CALENDÁRIO ============================== */
const HOURS = Array.from({length:18},(_,i)=>i+5);
function renderCalendario(){
  const days = Array.from({length:7},(_,i)=>addDaysStr(calWeekStart,i));
  const minutesFromMidnight = (t)=>{ const [h,m]=t.split(":").map(Number); return h*60+m; };
  const topFor = (t)=> ((minutesFromMidnight(t)-5*60)/60)*48;
  const heightFor = (s,e)=> Math.max(20, ((minutesFromMidnight(e)-minutesFromMidnight(s))/60)*48);
  const hasAny = state.events.length>0;
  return `
    <div class="page">
      <div class="card">
        <div class="card-head">
          <h3>Calendário semanal</h3>
          <div class="row-actions">
            <button class="btn btn-sm btn-ghost" onclick="calWeekStart=startOfWeek(todayStr());render();">Hoje</button>
            <button class="icon-btn" onclick="calWeekStart=addDaysStr(calWeekStart,-7);render();">${ic("chevronLeft",16)}</button>
            <span class="text-dim" style="font-size:13px">${fmtDatePretty(calWeekStart)} – ${fmtDatePretty(addDaysStr(calWeekStart,6))}</span>
            <button class="icon-btn" onclick="calWeekStart=addDaysStr(calWeekStart,7);render();">${ic("chevronRight",16)}</button>
          </div>
        </div>
        ${!hasAny ? emptyState("Seu dia está livre.") : ""}
        <p class="text-dim" style="font-size:11.5px;margin:-6px 0 12px">Os mesmos eventos da Rotina aparecem aqui. Marcar como concluído em um lugar conclui no outro.</p>
        <div class="cal-scroll">
          <div class="cal-grid" style="grid-template-columns:56px repeat(7, minmax(120px,1fr))">
            <div class="cal-corner"></div>
            ${days.map(d=>`<div class="cal-daylabel ${d===todayStr()?"cal-today":""}">${WEEKDAYS[new Date(d+"T00:00:00").getDay()]} <span class="text-dim">${fmtDatePretty(d)}</span></div>`).join("")}
            <div class="cal-hourcol">${HOURS.map(h=>`<div class="cal-hour">${pad2(h)}:00</div>`).join("")}</div>
            ${days.map(d=>`
              <div class="cal-daycol" style="height:${HOURS.length*48}px">
                ${HOURS.map(h=>`<div class="cal-cell" onclick="openEventModal(null,'${d}',${h})"></div>`).join("")}
                ${state.events.filter(e=>e.date===d).map(e=>`
                  <div class="cal-event ${e.done?"cal-event-done":""}" style="top:${topFor(e.start)}px;height:${heightFor(e.start,e.end)}px;background:${CATEGORY_COLORS[e.category]}33;border-left:3px solid ${CATEGORY_COLORS[e.category]}" onclick="event.stopPropagation();openEventModal('${e.id}')">
                    <button class="cal-event-chk ${e.done?"chk-on":""}" onclick="event.stopPropagation();toggleEvent('${e.id}')">${ic("check",11)}</button>
                    <div><strong class="${e.done?'timeline-done':''}">${esc(e.title)}</strong><span>${e.start}–${e.end}</span></div>
                  </div>`).join("")}
              </div>`).join("")}
          </div>
        </div>
      </div>
    </div>`;
}
